# Shared unoserver pool for a multi-node Stirling cluster.
#
# Every Stirling node points every one of its PROCESS_EXECUTOR_UNO_SERVER_ENDPOINTS_n
# entries at this one address, so the whole cluster draws from a single queue instead
# of each node guessing at capacity it cannot see.

global
    log stdout format raw local0 info
    maxconn 4000

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    # A conversion holds its connection open for the whole job, so these must exceed
    # UNOSERVER_CONVERSION_TIMEOUT or HAProxy cuts jobs unoserver would have finished.
    timeout client 1830s
    timeout server 1830s
    # Bounded wait for a free backend. Past this the caller gets 503 rather than
    # queueing forever behind a fleet that is too small.
    timeout queue 300s

# Docker's embedded DNS. Re-resolved on the hold timers below, which is what lets
# `docker compose up --scale unoserver=N` change capacity with nothing restarted.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold other 5s
    hold refused 5s
    hold nx 5s
    hold timeout 5s

frontend uno_in
    bind *:2003
    default_backend uno_pool

# Stats page plus a Prometheus endpoint: queue depth and per-server session counts
# are the two numbers that say whether the pool is the bottleneck.
frontend uno_stats
    bind *:8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /
    stats refresh 5s

backend uno_pool
    balance leastconn
    # maxconn 1 because unoserver runs one LibreOffice and converts strictly in
    # series: a second request does not run faster, it waits. Holding that queue
    # here makes it bounded, measurable, and shared across every Stirling node.
    server-template uno 20 unoserver:2003 check resolvers docker init-addr none maxconn 1
