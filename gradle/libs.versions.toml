[versions]
spring-boot = "4.1.1"
pdfbox = "3.0.8"
imageio = "3.15.2"
lombok = "1.18.46"
bouncycastle = "1.85"
spring-security-saml = "7.1.1"
open-saml = "5.2.1"
commonmark = "0.30.0"
google-java-format = "1.35.0"
logback = "1.6.3"
commons-io = "2.22.0"
commons-lang3 = "3.20.0"
rhino = "1.9.1"
okhttp = "5.4.0"
gson = "2.14.0"
guava = "33.6.0-jre"
jinjava = "2.8.4"
jackson2 = "2.22.3"
bucket4j = "8.19.0"
archunit = "1.5.0"
batik = "1.19"
jpdfium = "1.1.5"
jwt = "0.13.0"
aws-sdk = "2.54.13"
jsch = "2.28.7"
commons-net = "3.13.0"
smbj = "0.14.0"
tink = "1.23.0"
testcontainers = "1.21.4"
onnxruntime = "1.26.0"

[libraries]
# Spring Boot BOM
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }

# PDFBox family
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
pdfbox-io = { module = "org.apache.pdfbox:pdfbox-io", version.ref = "pdfbox" }
pdfbox-xmpbox = { module = "org.apache.pdfbox:xmpbox", version.ref = "pdfbox" }
pdfbox-preflight = { module = "org.apache.pdfbox:preflight", version.ref = "pdfbox" }

# Common utilities
commons-io = { module = "commons-io:commons-io", version.ref = "commons-io" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
commons-net = { module = "commons-net:commons-net", version.ref = "commons-net" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
rhino = { module = "org.mozilla:rhino", version.ref = "rhino" }
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
commonmark-ext-gfm-tables = { module = "org.commonmark:commonmark-ext-gfm-tables", version.ref = "commonmark" }

# BouncyCastle family
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcutil = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "bouncycastle" }

# Batik family
batik-bridge = { module = "org.apache.xmlgraphics:batik-bridge", version.ref = "batik" }
batik-transcoder = { module = "org.apache.xmlgraphics:batik-transcoder", version.ref = "batik" }

# TwelveMonkeys ImageIO family
imageio-batik = { module = "com.twelvemonkeys.imageio:imageio-batik", version.ref = "imageio" }
imageio-bmp = { module = "com.twelvemonkeys.imageio:imageio-bmp", version.ref = "imageio" }
imageio-jpeg = { module = "com.twelvemonkeys.imageio:imageio-jpeg", version.ref = "imageio" }
imageio-tiff = { module = "com.twelvemonkeys.imageio:imageio-tiff", version.ref = "imageio" }
imageio-webp = { module = "com.twelvemonkeys.imageio:imageio-webp", version.ref = "imageio" }
imageio-psd = { module = "com.twelvemonkeys.imageio:imageio-psd", version.ref = "imageio" }

# Security and Auth
spring-security-core = { module = "org.springframework.security:spring-security-core", version.ref = "spring-security-saml" }
spring-security-saml2-service-provider = { module = "org.springframework.security:spring-security-saml2-service-provider", version.ref = "spring-security-saml" }
tink = { module = "com.google.crypto.tink:tink", version.ref = "tink" }
jwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jwt" }
jwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jwt" }
jwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jwt" }

# Logging, Lombok, Rate limiting
logback-core = { module = "ch.qos.logback:logback-core", version.ref = "logback" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
bucket4j-core = { module = "com.bucket4j:bucket4j_jdk17-core", version.ref = "bucket4j" }
bucket4j-lettuce = { module = "com.bucket4j:bucket4j_jdk17-lettuce", version.ref = "bucket4j" }

# JPDFium
jpdfium = { module = "com.stirling:jpdfium", version.ref = "jpdfium" }

# Network & Cloud
okhttp-bom = { module = "com.squareup.okhttp3:okhttp-bom", version.ref = "okhttp" }
aws-sdk-s3 = { module = "software.amazon.awssdk:s3", version.ref = "aws-sdk" }
aws-sdk-url-connection-client = { module = "software.amazon.awssdk:url-connection-client", version.ref = "aws-sdk" }
jsch = { module = "com.github.mwiede:jsch", version.ref = "jsch" }
smbj = { module = "com.hierynomus:smbj", version.ref = "smbj" }

# Templating & Machine Learning
jinjava = { module = "com.hubspot.jinjava:jinjava", version.ref = "jinjava" }
onnxruntime = { module = "com.microsoft.onnxruntime:onnxruntime", version.ref = "onnxruntime" }

# Testing
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-minio = { module = "org.testcontainers:minio", version.ref = "testcontainers" }
testcontainers-localstack = { module = "org.testcontainers:localstack", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }

# Jackson 2 transitive overrides
jackson2-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson2" }
jackson2-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson2" }
jackson2-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson2" }
jackson2-datatype-jdk8 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jdk8", version.ref = "jackson2" }
jackson2-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson2" }

# Stirling in-house converters
stirling-office-convert = { module = "com.stirling:stirling-office-convert", version.ref = "office-convert" }
stirling-office-convert-legacy = { module = "com.stirling:stirling-office-convert-legacy", version.ref = "office-convert" }
stirling-office-convert-topdf = { module = "com.stirling:stirling-office-convert-topdf", version.ref = "office-convert" }
