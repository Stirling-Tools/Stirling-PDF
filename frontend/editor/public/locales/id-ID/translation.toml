[onboarding.serverLicense]
freeBody = "Lisensi <strong>Open-Core</strong> kami mencakup <strong>OAuth SSO</strong> dan hingga <strong>{{freeTierLimit}}</strong> pengguna secara gratis. Untuk berkembang tanpa hambatan, kami menyarankan paket Stirling Team — <strong>100 pengguna</strong> seharga $99/bulan."
freeTitle = "Lisensi Server"
overLimitBody = "Lisensi kami mengizinkan hingga <strong>{{freeTierLimit}}</strong> pengguna gratis per server. Anda memiliki <strong>{{overLimitUserCopy}}</strong> pengguna Stirling. Untuk terus berjalan tanpa gangguan, upgrade ke paket Stirling Server - <strong>kursi tanpa batas</strong>, pengeditan teks PDF, dan kontrol admin penuh seharga $99/server/bulan."
overLimitTitle = "Perlu Lisensi Server"
seePlans = "Lihat Paket →"
upgrade = "Upgrade sekarang →"

[onboarding.tourOverview]
body = "Stirling PDF V2 hadir dengan puluhan alat dan tata letak yang diperbarui. Ikuti tur singkat untuk melihat apa yang berubah dan di mana menemukan fitur yang Anda butuhkan."
