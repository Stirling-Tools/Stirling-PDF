settingsOverview = "ഇതാണ് <strong>ക്രമീകരണ പാനൽ</strong>. അഡ്മിൻ ക്രമീകരണങ്ങൾ എളുപ്പത്തിൽ നാവിഗേറ്റ് ചെയ്യാൻ വിഭാഗങ്ങളായി ക്രമപ്പെടുത്തിയിരിക്കുന്നു."
systemCustomization = "UI ഇഷ്ടാനുസൃതമാക്കാൻ നിരവധി വഴികളുണ്ട്: <strong>സിസ്റ്റം ക്രമീകരണങ്ങൾ</strong> വഴി ആപ്പ് പേര്, ഭാഷകൾ തുടങ്ങിയവ മാറ്റാം, <strong>സവിശേഷതകൾ</strong> വഴി സർവർ സർട്ടിഫിക്കറ്റ് മാനേജ്മെന്റ് ചെയ്യാം, <strong>എൻഡ്പോയിന്റുകൾ</strong> വഴി നിങ്ങളുടെ ഉപയോക്താക്കൾക്കായി പ്രത്യേക ടൂളുകൾ പ്രാപ്തമാക്കുകയോ പ്രവർത്തനരഹിതമാക്കുകയോ ചെയ്യാം."
teamsAndUsers = "ഇവിടെ <strong>ടീമുകളും</strong> വ്യക്തിഗത ഉപയോക്താക്കളെയും നിയന്ത്രിക്കുക. നിങ്ങൾക്ക് ഇമെയിൽ, പങ്കിടാവുന്ന ലിങ്കുകൾ വഴി ക്ഷണിക്കുകയോ, അല്ലെങ്കിൽ അവരുടെ അക്കൗണ്ടുകൾ സ്വയം സൃഷ്ടിക്കുകയോ ചെയ്യാം."
welcome = "<strong>അഡ്മിൻ ടൂർ</strong> ലേക്ക് സ്വാഗതം! സിസ്റ്റം അഡ്മിനിസ്ട്രേറ്റർമാർക്കുള്ള ശക്തമായ എന്റർപ്രൈസ് സവിശേഷതകളും ക്രമീകരണങ്ങളും കണ്ടറിയാം."
wrapUp = "അഡ്മിൻ tour ഇതോടെ കഴിഞ്ഞു! Stirling PDF-നെ സ്ഥാപനങ്ങൾക്കായി ശക്തവും ഇഷ്ടാനുസൃതമാക്കാവുന്നതുമായ solution ആക്കുന്ന enterprise features നിങ്ങൾ കണ്ടു. ഇത് ഏത് സമയത്തും വീണ്ടും play ചെയ്യാം - <strong>Settings</strong> തുറന്ന് Help-ന്റെ കീഴിലുള്ള <strong>Tours</strong> section-ൽ ഇത് കണ്ടെത്തുക."

