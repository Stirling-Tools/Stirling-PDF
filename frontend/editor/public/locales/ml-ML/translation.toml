step4 = "4. settings.yml-ൽ formDetection.activeModelId മോഡലിന്റെ id ആയി സജ്ജമാക്കി റീസ്റ്റാർട്ട് ചെയ്യുക. <configs> configs volume ആണ് (ഉദാ. Docker-ൽ /configs). air-gapped image-ൽ ഇതിനകം ഒരു മോഡൽ ഇൻസ്റ്റാൾ ചെയ്തിട്ടുണ്ട്."

