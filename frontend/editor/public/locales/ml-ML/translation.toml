[onboarding.desktopWelcome]
body = "<strong>Agent Chat</strong>, സ്വയമേവയുള്ള ഡോക്യുമെന്റ് <strong>classification</strong>, കൂടാതെ കൂടുതൽ എന്നിവ ഉൾപ്പെടെ പുതിയ മാറ്റങ്ങൾ അന്വേഷിക്കാൻ ധാരാളം ഉണ്ട്."
