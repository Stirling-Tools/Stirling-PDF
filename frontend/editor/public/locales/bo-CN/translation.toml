text = "ཁྱེད་ཀྱི་PDF དེ་རྩོམ་སྒྲིག་མི་བྱེད་པར་བཀང་ཐུབ་པའི་རྣམ་པ་དང་མཐེབ་དེ་ཚོ་དུས་རྒྱུན་གྱི་ཡིག་ཆ་དང་པར་རིས་ལ་བསྒྱུར་ནས་ཁྱེད་ཀྱི་PDF རྩོམ་སྒྲིག་བྱེད་མི་ཐུབ་པ་བཟོས། PDF དེ་གཅིག་པ་མཐོང་རྒྱུ་ཡིན། འོན་ཀྱང་སུས་ཀྱང་འབྲི་ཤོག་བརྗེ་སྒྱུར་བྱེད་མི་ཐུབ་པའམ་ཡང་ན་བཀང་མི་ཐུབ། ཡིག་ཆ་ཚང་མ་བགོ་འགྲེམས་དང་། ཐོ་འགོད་ཀྱི་མཐའ་མའི་ཡིག་ཆ་བཟོ་བ། ཡང་ན་PDFདེ་ས་ཆ་གང་སར་འདྲ་པོ་ཡོད་པར་འགན་ལེན་བྱེད་པར་འཚམ་པོ་ཡོད།"
