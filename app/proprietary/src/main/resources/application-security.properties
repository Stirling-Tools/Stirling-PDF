# Hibernate L2 Caching with Caffeine / JCache
# Scoped to the "security" profile, which SPDFApplication activates exactly when the
# :proprietary module is on the classpath (STIRLING_FLAVOR=proprietary/saas). Core-only builds
# (STIRLING_FLAVOR=core / DISABLE_ADDITIONAL_FEATURES=true) never activate this profile and never
# ship hibernate-jcache + caffeine, so the JCache classes below must not be referenced by default
# config that a core runtime reads.
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.internal.JCacheRegionFactory
spring.jpa.properties.hibernate.javax.cache.provider=com.github.benmanes.caffeine.jcache.spi.CaffeineCachingProvider
# Fail on a region that has no explicit application.conf entry instead of the default
# create-warn, which Hibernate docs (User Guide 14.10.3) warn "may not be suitable for production
# usage (unlimited size and no eviction in particular)". Every @Cacheable entity/collection must
# have a matching caffeine.jcache region block; otherwise startup fails loudly here.
spring.jpa.properties.hibernate.javax.cache.missing_cache_strategy=fail
# Hibernate statistics tracking has per-operation overhead; the L2 cache test enables it on demand.
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.jakarta.persistence.sharedCache.mode=ENABLE_SELECTIVE
