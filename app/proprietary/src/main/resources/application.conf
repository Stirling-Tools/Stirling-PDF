# Per-region policies for the Caffeine JCache caches backing Hibernate's second-level cache.
#
# The schema below follows the caffeine-jcache provider's own reference.conf (shipped in the
# jcache jar): bounded size is `policy.maximum.size`, expiry is `policy.eager-expiration.after-write`
# and statistics is `monitoring.statistics`. Keys written against any other schema (e.g.
# `policy.maximum` / `policy.expire-after-write` / `statistics-enabled`) are silently ignored by
# the provider and the region falls back to unbounded, eternal-expiry Caffeine defaults.
#
# Region names match the `@Cache(region = "...")` values on the cached entities. A region shared by
# an entity and its collections (e.g. "users") maps to one Caffeine cache.
caffeine.jcache {
  default {
    policy {
      maximum {
        size = 500
      }
      eager-expiration {
        after-write = 15m
      }
    }
    monitoring {
      statistics = true
    }
  }

  policies {
    policy {
      maximum {
        size = 500
      }
      eager-expiration {
        after-write = 30m
      }
    }
    monitoring {
      statistics = true
    }
  }

  policy-sources {
    policy {
      maximum {
        size = 500
      }
      eager-expiration {
        after-write = 30m
      }
    }
    monitoring {
      statistics = true
    }
  }

  teams {
    policy {
      maximum {
        size = 1000
      }
      eager-expiration {
        after-write = 15m
      }
    }
    monitoring {
      statistics = true
    }
  }

  user-license-settings {
    policy {
      maximum {
        size = 2000
      }
      eager-expiration {
        after-write = 1h
      }
    }
    monitoring {
      statistics = true
    }
  }

  users {
    policy {
      maximum {
        size = 5000
      }
      eager-expiration {
        after-write = 5m
      }
    }
    monitoring {
      statistics = true
    }
  }

  saas-pricing-policies {
    policy {
      maximum {
        size = 100
      }
      eager-expiration {
        after-write = 24h
      }
    }
    monitoring {
      statistics = true
    }
  }

  saas-legal-consents {
    policy {
      maximum {
        size = 5000
      }
      eager-expiration {
        after-write = 1h
      }
    }
    monitoring {
      statistics = true
    }
  }

  saas-subscriptions {
    policy {
      maximum {
        size = 5000
      }
      eager-expiration {
        after-write = 15m
      }
    }
    monitoring {
      statistics = true
    }
  }

  saas-user-extensions {
    policy {
      maximum {
        size = 5000
      }
      eager-expiration {
        after-write = 5m
      }
    }
    monitoring {
      statistics = true
    }
  }

  saas-team-extensions {
    policy {
      maximum {
        size = 1000
      }
      eager-expiration {
        after-write = 15m
      }
    }
    monitoring {
      statistics = true
    }
  }
}
