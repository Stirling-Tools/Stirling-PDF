repositories {
    maven { url = "https://repository.jboss.org/" }
    maven { url = "https://build.shibboleth.net/maven/releases" }
}

// CPU build with self-extracting natives for linux/win/mac x64+arm64. Must stay >=1.21: the
// model exports are stamped ai.onnx opset 22, which 1.19/1.20 reject outright (version in libs.versions.toml).
bootRun {
    enabled = false
}
dependencies {
    implementation project(':common')
    api libs.guava

    api 'org.springframework:spring-jdbc'
    api 'org.springframework:spring-webmvc'
    api 'org.springframework.session:spring-session-core'
    api libs.spring.security.core
    api libs.spring.security.saml2.service.provider
    api 'org.springframework.boot:spring-boot-starter-jetty'
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    // MCP server (RFC 8707 audience binding + RFC 9728 metadata) - resource-server side only.
    // Brings nimbus-jose-jwt onto the proprietary classpath if not already transitive via
    // oauth2-client; on Boot 4.0.6 the delta is around 130KB because nimbus is already pulled.
    api 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    api 'org.springframework.boot:spring-boot-starter-mail'
    api 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // Supplies GenericObjectPoolConfig for the Lettuce pool, which today backs only the single
    // shared native connection; headroom for a future dedicated-connection path.
    implementation 'org.apache.commons:commons-pool2'
    api libs.swagger.core.jakarta
    implementation libs.bucket4j.core
    // Lettuce-backed Bucket4j ProxyManager used by ValkeyRateLimitStore for cluster-wide
    // token-bucket rate limiting (parity with in-process Bucket4j semantics; no fixed-window
    // boundary doubling).
    implementation libs.bucket4j.lettuce

    // https://mvnrepository.com/artifact/com.bucket4j/bucket4j_jdk17
    implementation libs.bouncycastle.bcprov

    // PDF/UA tagging and its validation oracle.
    implementation libs.verapdf.validation.model

    // CVE-2022-25647: tabula pulls an old gson with unsafe deserialization. The central
    // resolutionStrategy.force is not enough on its own - a module only pulled transitively
    // gets the Spring Boot BOM's version instead - so this declaration is what holds the pin.
    implementation libs.gson
    // veraPDF still uses javax.xml.bind, not the new jakarta namespace
    implementation libs.jaxb.api
    runtimeOnly libs.jaxb.impl
    runtimeOnly libs.jaxb.core


    // ONNX Runtime (Java) runs Auto Form Detection. The ~42MB multi-platform native is bundled
    // only with -PbundleOnnxRuntime=true (Docker); without it the tool reports unavailable.
    compileOnly libs.onnxruntime
    testImplementation libs.onnxruntime
    if ((project.findProperty('bundleOnnxRuntime') ?: 'false').toString().toBoolean()) {
        runtimeOnly libs.onnxruntime
    }

    // jinjava/jjwt transitively request older Jackson 2 versions; declare the current
    // version directly so it is selected consistently (root build.gradle pins are the fallback).
    runtimeOnly libs.jackson2.core
    runtimeOnly libs.jackson2.databind

    implementation(libs.jinjava) {
        // Compile-time-only annotation artifacts (class-retention annotations, not needed at
        // runtime) whose declared licences (LGPL / none) fail the licence compatibility check.
        exclude group: 'com.google.code.findbugs', module: 'annotations'
        exclude group: 'org.derive4j', module: 'derive4j-annotation'
        exclude group: 'com.hubspot.immutables', module: 'hubspot-style'
        exclude group: 'com.hubspot.immutables', module: 'immutable-collection-encodings'
    }

    api 'io.micrometer:micrometer-registry-prometheus'

    api libs.jwt.api
    runtimeOnly libs.jwt.impl
    runtimeOnly libs.jwt.jackson
    runtimeOnly libs.h2 // Don't upgrade h2database - file format incompatible with 2.4.x, would break existing user databases
    runtimeOnly libs.postgresql
    implementation(libs.saml.client) {
        exclude group: 'org.opensaml', module: 'opensaml-core'
    }

    implementation libs.aws.sdk.s3
    implementation libs.aws.sdk.url.connection.client

    // Network policy sources (SFTP/FTP/SMB drop folders). All permissively licensed:
    // jsch fork BSD, commons-net Apache-2.0, smbj Apache-2.0 (BouncyCastle already on classpath).
    implementation libs.jsch
    implementation libs.commons.net
    implementation libs.smbj

    // Streaming AEAD (AES-GCM-HKDF segments) for storage encryption at rest. Apache-2.0.
    implementation libs.tink

    // @DataJpaTest slice (Boot 4 ships test slices as separate starters, like webmvc-test at the
    // root) so policy.source repositories can be exercised against embedded H2.
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'

    // Testcontainers: real MinIO/LocalStack (S3) and Valkey for integration tests in CI without
    // manually-started instances. Tests skip cleanly when Docker is unavailable.
    testImplementation libs.testcontainers
    testImplementation libs.testcontainers.minio
    testImplementation libs.testcontainers.localstack
    testImplementation libs.testcontainers.postgresql
    testImplementation libs.testcontainers.junit.jupiter
}

// Golden extraction fixtures live in :common; the advanced converter is graded against the same
// corpus as the built-in one rather than a forked copy of it.
processTestResources {
    from(project(':common').file('src/test/resources/pdf-ingestion-fixtures')) {
        into 'pdf-ingestion-fixtures'
    }
}

tasks.register('prepareKotlinBuildScriptModel') {}

tasks.register('type3SignatureTool', JavaExec) {
    group = 'type3'
    description = 'Dump Type3 font signatures and glyph coverage for the Type3 library'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'stirling.software.SPDF.service.pdfjson.type3.tool.Type3SignatureTool'
    standardInput = System.in
}

// FailureKindTest asserts the enum against two files outside this project, found by walking up to
// the repo root: the kind-to-code fixture the frontend also reads, and the English copy every kind
// must have a key in. Gradle cannot infer either, so without this the task is up-to-date when only
// one of them changed and the mismatch surfaces on the next unrelated Java edit instead.
tasks.named('test', Test).configure {
    inputs.files(
        rootProject.file('testing/failure-kind-codes.json'),
        rootProject.file('frontend/editor/public/locales/en-US/translation.toml')
    ).withPropertyName('sharedConformanceFixtures').optional()
}
