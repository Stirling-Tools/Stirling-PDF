repositories {
    maven { url = "https://repository.jboss.org/" }
    maven { url = "https://build.shibboleth.net/maven/releases" }
}

bootRun {
    enabled = false
}

dependencies {
    implementation project(':common')

    api 'org.springframework:spring-jdbc'
    api 'org.springframework:spring-webmvc'
    api 'org.springframework.session:spring-session-core'
    api "org.springframework.security:spring-security-core:${libs.versions.springSecuritySaml2.get()}"
    api "org.springframework.security:spring-security-saml2-service-provider:${libs.versions.springSecuritySaml2.get()}"
    api 'org.springframework.boot:spring-boot-starter-jetty'
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    // MCP server (RFC 8707 audience binding + RFC 9728 metadata) - resource-server side only.
    // Brings nimbus-jose-jwt onto the proprietary classpath if not already transitive via
    // oauth2-client; on Boot 4.0.6 the delta is around 130KB because nimbus is already pulled.
    api 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    api 'org.springframework.boot:spring-boot-starter-mail'
    api 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    api "io.swagger.core.v3:swagger-core-jakarta:${libs.versions.swaggerCore.get()}"
    implementation "com.bucket4j:bucket4j_jdk17-core:${libs.versions.bucket4j.get()}"
    // Lettuce-backed Bucket4j ProxyManager used by ValkeyRateLimitStore for cluster-wide
    // token-bucket rate limiting (parity with in-process Bucket4j semantics; no fixed-window
    // boundary doubling).
    implementation "com.bucket4j:bucket4j_jdk17-lettuce:${libs.versions.bucket4j.get()}"

    // https://mvnrepository.com/artifact/com.bucket4j/bucket4j_jdk17
    implementation "org.bouncycastle:bcprov-jdk18on:${libs.versions.bouncycastle.get()}"

    implementation "com.google.code.gson:gson:${libs.versions.gson.get()}"

    // jinjava/jjwt transitively request older Jackson 2 versions; declare the current
    // version directly so it is selected consistently (root build.gradle pins are the fallback).
    api "com.fasterxml.jackson.core:jackson-core:${libs.versions.jacksonV2.get()}"
    api "com.fasterxml.jackson.core:jackson-databind:${libs.versions.jacksonV2.get()}"

    implementation("com.hubspot.jinjava:jinjava:${libs.versions.jinjava.get()}") {
        // Compile-time-only annotation artifacts (class-retention annotations, not needed at
        // runtime) whose declared licences (LGPL / none) fail the licence compatibility check.
        exclude group: 'com.google.code.findbugs', module: 'annotations'
        exclude group: 'org.derive4j', module: 'derive4j-annotation'
        exclude group: 'com.hubspot.immutables', module: 'hubspot-style'
        exclude group: 'com.hubspot.immutables', module: 'immutable-collection-encodings'
    }

    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    implementation "io.jsonwebtoken:jjwt-api:${libs.versions.jwt.get()}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${libs.versions.jwt.get()}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${libs.versions.jwt.get()}"
    runtimeOnly "com.h2database:h2:${libs.versions.h2.get()}" // Don't upgrade h2database - file format incompatible with 2.4.x, would break existing user databases
    runtimeOnly "org.postgresql:postgresql:${libs.versions.postgresql.get()}"
    implementation("com.coveo:saml-client:${libs.versions.samlClient.get()}") {
        exclude group: 'org.opensaml', module: 'opensaml-core'
    }

    implementation "software.amazon.awssdk:s3:${libs.versions.awsSdk.get()}"
    implementation "software.amazon.awssdk:url-connection-client:${libs.versions.awsSdk.get()}"

    // Network policy sources (SFTP/FTP/SMB drop folders). All permissively licensed:
    // jsch fork BSD, commons-net Apache-2.0, smbj Apache-2.0 (BouncyCastle already on classpath).
    implementation "com.github.mwiede:jsch:${libs.versions.jsch.get()}"
    implementation "commons-net:commons-net:${libs.versions.commonsNet.get()}"
    implementation "com.hierynomus:smbj:${libs.versions.smbj.get()}"

    // Streaming AEAD (AES-GCM-HKDF segments) for storage encryption at rest. Apache-2.0.
    implementation "com.google.crypto.tink:tink:${libs.versions.tink.get()}"

    // @DataJpaTest slice (Boot 4 ships test slices as separate starters, like webmvc-test at the
    // root) so policy.source repositories can be exercised against embedded H2.
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'

    // Testcontainers: real MinIO/LocalStack (S3) and Valkey for integration tests in CI without
    // manually-started instances. Tests skip cleanly when Docker is unavailable.
    testImplementation "org.testcontainers:testcontainers:${libs.versions.testcontainers.get()}"
    testImplementation "org.testcontainers:minio:${libs.versions.testcontainers.get()}"
    testImplementation "org.testcontainers:localstack:${libs.versions.testcontainers.get()}"
    testImplementation "org.testcontainers:postgresql:${libs.versions.testcontainers.get()}"
    testImplementation "org.testcontainers:junit-jupiter:${libs.versions.testcontainers.get()}"
}

tasks.register('prepareKotlinBuildScriptModel') {}

tasks.register('type3SignatureTool', JavaExec) {
    group = 'type3'
    description = 'Dump Type3 font signatures and glyph coverage for the Type3 library'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'stirling.software.SPDF.service.pdfjson.type3.tool.Type3SignatureTool'
    standardInput = System.in
}
