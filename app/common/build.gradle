// Configure bootRun to disable it or point to a main class
bootRun {
    enabled = false
}

dependencies {
    implementation "com.google.guava:guava:${libs.versions.guava.get()}"
    api 'org.springframework.boot:spring-boot-starter-webmvc'
    api 'org.springframework.boot:spring-boot-starter-aspectj'
    api "com.googlecode.owasp-java-html-sanitizer:owasp-java-html-sanitizer:${libs.versions.owaspJavaHtmlSanitizer.get()}"
    api "com.fathzer:javaluator:${libs.versions.javaluator.get()}"
    api "com.posthog.java:posthog:${libs.versions.posthog.get()}"
    api "org.apache.commons:commons-lang3:${libs.versions.commonsLang3.get()}"
    api "com.drewnoakes:metadata-extractor:${libs.versions.metadataExtractor.get()}" // Image metadata extractor
    api "com.vladsch.flexmark:flexmark-html2md-converter:${libs.versions.flexmark.get()}"
    api "org.apache.pdfbox:pdfbox:${libs.versions.pdfbox.get()}"
    api "org.apache.pdfbox:pdfbox-io:${libs.versions.pdfbox.get()}"
    api "org.apache.pdfbox:xmpbox:${libs.versions.pdfbox.get()}"
    api "org.apache.pdfbox:preflight:${libs.versions.pdfbox.get()}"
    api "com.github.junrar:junrar:${libs.versions.junrar.get()}" // RAR archive support for CBR files
    api "jakarta.servlet:jakarta.servlet-api:${libs.versions.servletApi.get()}"
    api "org.snakeyaml:snakeyaml-engine:${libs.versions.snakeyamlEngine.get()}"
    api "org.springdoc:springdoc-openapi-starter-webmvc-ui:${libs.versions.springdocOpenapi.get()}"
    // Simple Java Mail for EML/MSG parsing (replaces direct Angus Mail usage)
    api "org.simplejavamail:simple-java-mail:${libs.versions.simpleJavaMail.get()}"
    api "org.simplejavamail:outlook-module:${libs.versions.simpleJavaMail.get()}" // MSG file support
    api "jakarta.mail:jakarta.mail-api:${libs.versions.jakartaMail.get()}"
    runtimeOnly "org.eclipse.angus:angus-mail:${libs.versions.angusMail.get()}"

    // Tabula table extraction — used by the shared PDF parser and directly by downstream modules.
    // api-scoped so downstream modules (core, proprietary) retain it on their compile classpath.
    api ("technology.tabula:tabula:${libs.versions.tabula.get()}") {
        exclude group: 'org.slf4j', module: 'slf4j-simple'
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
        exclude group: 'com.google.code.gson', module: 'gson'
    }

    api "com.stirling:jpdfium:${libs.versions.jpdfium.get()}"

    // -PjpdfiumPlatforms=all|<csv of linux-x64,linux-arm64,darwin-x64,darwin-arm64,windows-x64>
    def jpdfiumPlatformsProp = (project.findProperty('jpdfiumPlatforms') ?: 'all').toString().trim()
    def jpdfiumAllPlatforms = ['linux-x64', 'linux-arm64', 'darwin-x64', 'darwin-arm64', 'windows-x64']
    def jpdfiumPlatforms = jpdfiumPlatformsProp == 'all'
            ? jpdfiumAllPlatforms
            : jpdfiumPlatformsProp.split(',').collect { it.trim() }.findAll { it }
    def jpdfiumInvalid = jpdfiumPlatforms.findAll { !jpdfiumAllPlatforms.contains(it) }
    if (jpdfiumInvalid) {
        throw new GradleException("Unknown jpdfiumPlatforms value(s): ${jpdfiumInvalid.join(', ')}. " +
                "Valid: ${jpdfiumAllPlatforms.join(', ')} or 'all'.")
    }
    logger.lifecycle("JPDFium native platforms: ${jpdfiumPlatforms.join(', ')}")
    jpdfiumPlatforms.each { platform ->
        runtimeOnly "com.stirling:jpdfium-natives-${platform}:${libs.versions.jpdfium.get()}"
    }

    // Bucket4j (local in-process token bucket for RateLimitStore default impl)
    implementation "com.bucket4j:bucket4j_jdk17-core:${libs.versions.bucket4j.get()}"

    // ArchUnit: enforces module dependency direction (see ArchitectureTest)
    testImplementation "com.tngtech.archunit:archunit-junit5:${libs.versions.archunit.get()}"
}
