# Gradle daemon heap. Without this the daemon uses Gradle's 512m default, which the SaaS build
# variant (it compiles saas + proprietary + core together) exhausts during compileTestJava under
# parallel execution, causing intermittent "JVM garbage collector is thrashing" daemon deaths.
# 2 GiB heap + 1 GiB metaspace gives comfortable headroom on CI runners and typical dev machines.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Enables parallel execution of tasks, allowing multiple tasks to run simultaneously
org.gradle.parallel=true

# Enables build caching to reuse outputs from previous builds for faster execution
org.gradle.caching=true

# Configuration cache for faster recurring task configuration
org.gradle.configuration-cache=true

# Allow Gradle to download the toolchain version requested by the build
org.gradle.java.installations.auto-download=true

org.gradle.daemon=true
