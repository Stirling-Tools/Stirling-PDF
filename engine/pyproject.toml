[project]
name = "engine"
version = "0.1.0"
description = "AI Document Engine"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=2.0.0,<3.0.0",
    "pgvector>=0.5.0",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic>=2.13.4",
    # Keep the v1 line until the engine is migrated to Pydantic AI v2.
    "pydantic-ai>=1.107.1,<2.0.0",
    "pydantic-ai-slim[voyageai]>=1.107.1,<2.0.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "starlette>=1.3.1",
    "sqlite-vec>=0.1.9",
    "uvicorn>=0.52.1",
    "opentelemetry-sdk>=1.39.0,<1.44.0",
    "posthog>=7.37.3",
]

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "datamodel-code-generator[ruff]>=0.72.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyright>=1.1.411",
    "referencing>=0.37.0",
    "ruff>=0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
exclude = [
    "tests",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "RUF100",
    "UP",
    "PYI",    # flake8-pyi: flags deprecated typing constructs
    "FA",     # flake8-future-annotations: flags missing future annotations imports
    "BLE",    # flake8-blind-except: flags bare `except Exception`
]

[tool.pyright]
pythonVersion = "3.13"

reportImportCycles = "warning"
reportUnnecessaryCast = "warning"
reportUnnecessaryTypeIgnoreComment = "warning"
reportUnusedImport = "warning"
reportUnknownParameterType = "warning"
reportDeprecated = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
# ``tests`` is on the path so test modules can import shared helpers (e.g.
# ``from conftest import build_app_settings``) without packaging the tests dir.
pythonpath = ["src", "tests"]
# Use importlib import mode so test directories don't need __init__.py files
# and duplicate basenames (e.g. multiple test_routes.py) collect cleanly.
addopts = "--import-mode=importlib"
