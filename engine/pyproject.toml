[project]
name = "engine"
version = "0.1.0"
description = "AI Document Engine for Stirling PDF"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
# Runtime dependencies for the AI document engine service.
engine = [
    "cryptography>=50.0.0",
    "fastapi>=0.116.0",
    "opentelemetry-sdk>=1.39.0",
    "pgvector>=0.3.6",
    "posthog>=3.0.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.0.0",
    # <2 cap: 1.99.0 patches CVE-2026-46678; 2.0 is an untested major migration.
    "pydantic-ai>=1.99.0,<2.0.0",
    "pydantic-ai-slim[voyageai]>=1.99.0,<2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.2.1",
    "sqlite-vec>=0.1.6",
    "uvicorn>=0.35.0",
]
# Type checking, testing, model generation, and formatting tools for the engine.
engine-dev = [
    "anyio>=4.0.0",
    "datamodel-code-generator[ruff]==0.64.0",
    "pyright>=1.1.408",
    "pytest>=8.0.0",
    "referencing>=0.35.0",
    "ruff==0.15.5",
]
# Dependencies for the Cucumber/Python integration test suite.
cucumber = [
    "behave>=1.3.3",
    "behave-html-formatter>=0.9.10",
    "opencv-python-headless>=4.0.0",
    "pdf2image>=1.0.0",
    "pillow>=10.0.0",
    "pypdf>=6.14.2",
    "qrcode[pil]>=8.2",
    "reportlab>=5.0.0",
    "requests>=2.34.2",
]
# Shared Python utilities used by repository scripts and CI workflows.
tools = [
    "brotli @ git+https://github.com/google/brotli.git@028fb5a23661f123017c060daa546b55cf4bde29",
    "deep-translator>=1.11.0",
    "defusedxml>=0.7.1",
    "fonttools>=4.0.0",
    "fpdf2>=2.0.0",
    "openai>=1.0.0",
    "requests>=2.34.2",
    "tomli-w>=1.2.0",
    "tomlkit>=0.13.0",
    "urllib3>=2.0.0",
    "unoserver>=3.6",
    "weasyprint>=60.0",
]
# Release-signature verification dependencies.
updater-signatures = [
    "cryptography>=50.0.0",
]
# Pinned repository-wide pre-commit tooling.
pre-commit = [
    "codespell==2.4.2",
    "ruff==0.15.5",
    "tomli-w==1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
exclude = ["tests"]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "RUF100",
    "UP",
    "PYI", # flake8-pyi: flags deprecated typing constructs
    "FA",  # flake8-future-annotations: flags missing future annotations imports
    "BLE", # flake8-blind-except: flags bare `except Exception`
]

[tool.ruff.lint.isort]
known-first-party = ["stirling", "tests"]

[tool.pyright]
pythonVersion = "3.13"
reportImportCycles = "warning"
reportUnnecessaryCast = "warning"
reportUnnecessaryTypeIgnoreComment = "warning"
reportUnusedImport = "warning"
reportUnknownParameterType = "warning"
reportDeprecated = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
# ``tests`` is on the path so test modules can import shared helpers (e.g.
# ``from conftest import build_app_settings``) without packaging the tests dir.
pythonpath = ["src", "tests"]
# Use importlib import mode so test directories don't need __init__.py files
# and duplicate basenames (e.g. multiple test_routes.py) collect cleanly.
addopts = "--import-mode=importlib"
