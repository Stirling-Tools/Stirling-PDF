x-uno: &uno
  image: ghcr.io/stirling-tools/stirling-unoserver:latest
  environment:
    UNOSERVER_PORT: "2003"
    UNOSERVER_CONVERSION_TIMEOUT: "1800"
    UNOSERVER_RECYCLE_INTERVAL_SECONDS: "3600"
  healthcheck:
    test: ["CMD-SHELL", "unoping --host 127.0.0.1 --port 2003 || exit 1"]
    interval: 10s
    timeout: 10s
    retries: 3
    start_period: 30s
  restart: unless-stopped
  networks: [stirling]

services:
  stirling-pdf:
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:latest
    ports:
      - "8080:8080"
    environment:
      PROCESS_EXECUTOR_AUTO_UNO_SERVER: "false"
      PROCESS_EXECUTOR_UNO_SERVER_ENDPOINTS_0_HOST: "unoserver-1"
      PROCESS_EXECUTOR_UNO_SERVER_ENDPOINTS_0_PORT: "2003"
      PROCESS_EXECUTOR_UNO_SERVER_ENDPOINTS_0_HOST_LOCATION: "remote"
      PROCESS_EXECUTOR_UNO_SERVER_ENDPOINTS_1_HOST: "unoserver-2"
      PROCESS_EXECUTOR_UNO_SERVER_ENDPOINTS_1_PORT: "2003"
      PROCESS_EXECUTOR_UNO_SERVER_ENDPOINTS_1_HOST_LOCATION: "remote"
      PROCESS_EXECUTOR_SESSION_LIMIT_LIBRE_OFFICE_SESSION_LIMIT: "2"
    depends_on:
      unoserver-1:
        condition: service_healthy
      unoserver-2:
        condition: service_healthy
    restart: unless-stopped
    networks: [stirling]

  unoserver-1:
    <<: *uno
  unoserver-2:
    <<: *uno

networks:
  stirling:
