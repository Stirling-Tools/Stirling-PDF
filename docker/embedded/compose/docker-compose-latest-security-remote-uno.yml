services:
  stirling-pdf:
    container_name: Stirling-PDF-Security-Remote-UNO
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:latest
    build:
      context: ../../..
      dockerfile: docker/embedded/Dockerfile
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The entrypoint boots as root to reconcile mount ownership, then setpriv's down to
    # PUID/PGID. SETUID and SETGID are always fatal to drop: the drop itself needs them.
    # CHOWN and DAC_OVERRIDE are fatal whenever root has to reconcile data dirs owned by a
    # different uid, which is any PUID/PGID remap or foreign-owned mount. FOWNER only lets
    # root chmod what it has just handed over. KILL lets PID 1 signal across the uid boundary
    # it created, so docker stop reaches the JVM instead of the kernel SIGKILLing it.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080$${SYSTEM_ROOTURIPATH:-''}/api/v1/info/status | grep -q 'UP'"]
      interval: 5s
      timeout: 10s
      retries: 16
    ports:
      - 8080:8080
    volumes:
      - ../../../stirling/latest/data:/usr/share/tessdata:rw
      - ../../../stirling/latest/config:/configs:rw
      - ../../../stirling/latest/logs:/logs:rw
    environment:
      DISABLE_ADDITIONAL_FEATURES: "false"
      SECURITY_ENABLELOGIN: "false"
      # Disable auto UNO server (we're using remote servers instead)
      PROCESS_EXECUTOR_AUTO_UNO_SERVER: "false"
      # Configure remote UNO server pool
      PROCESS_EXECUTOR_UNO_SERVER_ENDPOINTS_0_HOST: "unoserver1"
      PROCESS_EXECUTOR_UNO_SERVER_ENDPOINTS_0_PORT: "2003"
      PROCESS_EXECUTOR_UNO_SERVER_ENDPOINTS_0_HOST_LOCATION: "remote"
      PROCESS_EXECUTOR_UNO_SERVER_ENDPOINTS_0_PROTOCOL: "http"
      PROCESS_EXECUTOR_UNO_SERVER_ENDPOINTS_1_HOST: "unoserver2"
      PROCESS_EXECUTOR_UNO_SERVER_ENDPOINTS_1_PORT: "2003"
      PROCESS_EXECUTOR_UNO_SERVER_ENDPOINTS_1_HOST_LOCATION: "remote"
      PROCESS_EXECUTOR_UNO_SERVER_ENDPOINTS_1_PROTOCOL: "http"
      # Session limit should match endpoint count for optimal concurrency
      PROCESS_EXECUTOR_SESSION_LIMIT_LIBRE_OFFICE_SESSION_LIMIT: "2"
      # STIRLING_JVM_PROFILE: "balanced"  # Options: balanced (G1GC, default), performance (Shenandoah)
      # JAVA_CUSTOM_OPTS: ""              # Additional JVM flags appended to the active profile
      PUID: 1002
      PGID: 1002
      UMASK: "022"
      SYSTEM_DEFAULTLOCALE: en-US
      UI_APPNAME: Stirling-PDF
      UI_HOMEDESCRIPTION: Demo site for Stirling-PDF Latest with Security + Remote UNO Servers
      UI_APPNAMENAVBAR: Stirling-PDF Latest
      SYSTEM_MAXFILESIZE: "100"
      METRICS_ENABLED: "true"
      SYSTEM_GOOGLEVISIBILITY: "true"
      SHOW_SURVEY: "true"
    depends_on:
      unoserver1:
        condition: service_healthy
      unoserver2:
        condition: service_healthy
    networks:
      - stirling-network
      - uno-internal
    restart: on-failure:5

  unoserver1:
    container_name: UNO-Server-1
    # See docker/unoserver/VERSION for available tags.
    image: ghcr.io/stirling-tools/stirling-unoserver:latest
    # The image already runs as a non-root user and never changes uid, so it
    # needs nothing back. Port 2003 is an unauthenticated XMLRPC control plane
    # that will convert() and write any path it can see.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      UNOSERVER_PORT: "2003"
      UNOSERVER_UNO_PORT: "2002"
      UNOSERVER_CONVERSION_TIMEOUT: "1800"
      # Recycle hourly to bound LibreOffice memory; 0 disables, floor 60s.
      UNOSERVER_RECYCLE_INTERVAL_SECONDS: "3600"
    expose:
      - "2003"
    networks:
      - uno-internal
    restart: on-failure:5

  unoserver2:
    container_name: UNO-Server-2
    image: ghcr.io/stirling-tools/stirling-unoserver:latest
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      UNOSERVER_PORT: "2003"
      UNOSERVER_UNO_PORT: "2002"
      UNOSERVER_CONVERSION_TIMEOUT: "1800"
      UNOSERVER_RECYCLE_INTERVAL_SECONDS: "3600"
    expose:
      - "2003"
    networks:
      - uno-internal
    restart: on-failure:5

networks:
  stirling-network:
    driver: bridge
  # The app needs egress (updates, OAuth, remote storage) so it keeps a foot on
  # stirling-network; the unoservers are only on this one and get no default
  # route off it, which is what stops a LibreOffice compromise from calling out.
  # It is not a wall between the containers that share it: unoserver1 can still
  # reach unoserver2 and the app.
  uno-internal:
    internal: true
