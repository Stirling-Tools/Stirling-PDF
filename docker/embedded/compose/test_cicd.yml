services:
  stirling-pdf:
    container_name: Stirling-PDF-Security-Fat-with-login
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:fat
    build:
      context: ../../../
      dockerfile: docker/embedded/Dockerfile.fat
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The entrypoint boots as root to reconcile mount ownership, then setpriv's down to
    # PUID/PGID. SETUID and SETGID are always fatal to drop: the drop itself needs them.
    # CHOWN and DAC_OVERRIDE are fatal whenever root has to reconcile data dirs owned by a
    # different uid, which is any PUID/PGID remap or foreign-owned mount. FOWNER only lets
    # root chmod what it has just handed over. KILL lets PID 1 signal across the uid boundary
    # it created, so docker stop reaches the JVM instead of the kernel SIGKILLing it.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "curl -f -H 'X-API-KEY: 123456789' http://localhost:8080${SYSTEM_ROOTURIPATH:-''}/api/v1/info/status | grep -q 'UP'"]
      interval: 5s
      timeout: 10s
      retries: 16
    ports:
      - 8080:8080
    volumes:
      - ../../../stirling/latest/data:/usr/share/tessdata:rw
      - ../../../stirling/latest/config:/configs:rw
      - ../../../stirling/latest/logs:/logs:rw
      - ../../../stirling/latest/storage:/storage:rw
    environment:
      DISABLE_ADDITIONAL_FEATURES: "false"
      SECURITY_ENABLELOGIN: "true"
      PUID: 1002
      PGID: 1002
      UMASK: "022"
      SYSTEM_DEFAULTLOCALE: en-US
      UI_APPNAME: Stirling-PDF
      UI_HOMEDESCRIPTION: Demo site for Stirling-PDF Latest-fat with Security
      UI_APPNAMENAVBAR: Stirling-PDF Latest-fat
      SYSTEM_MAXFILESIZE: "100"
      METRICS_ENABLED: "true"
      SYSTEM_GOOGLEVISIBILITY: "true"
      SYSTEM_ENABLEMOBILESCANNER: "true"
      SECURITY_CUSTOMGLOBALAPIKEY: "123456789"
      # Folder management + file-storage features the cucumber
      # `folders_and_files.feature` suite needs to upload PDFs against.
      # The folder endpoints and the storage upload endpoint short-circuit
      # to 403 "Storage is disabled" when this is left at its default false.
      STORAGE_ENABLED: "true"
    restart: on-failure:5
