services:
  stirling-pdf:
    build:
      context: ../..
      dockerfile: docker/embedded/Dockerfile.ultra-lite
    container_name: stirling-pdf-ultra-lite
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The entrypoint boots as root to reconcile mount ownership, then setpriv's down to
    # PUID/PGID. SETUID and SETGID are always fatal to drop: the drop itself needs them.
    # CHOWN and DAC_OVERRIDE are fatal whenever root has to reconcile data dirs owned by a
    # different uid, which is any PUID/PGID remap or foreign-owned mount. FOWNER only lets
    # root chmod what it has just handed over. KILL lets PID 1 signal across the uid boundary
    # it created, so docker stop reaches the JVM instead of the kernel SIGKILLing it.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080$${SYSTEM_ROOTURIPATH:-''}/api/v1/info/status | grep -q 'UP'"]
      interval: 5s
      timeout: 10s
      retries: 16
    ports:
      - "8080:8080"
    volumes:
      - ../../stirling/latest/config:/configs:rw
      - ../../stirling/latest/logs:/logs:rw
    environment:
      DISABLE_ADDITIONAL_FEATURES: "true"
      SECURITY_ENABLELOGIN: "false"
      ENDPOINTS_GROUPS_TO_REMOVE: "CLI"
      LANGS: "en_GB,en_US"
      SYSTEM_DEFAULTLOCALE: en-US
      UI_APPNAME: Stirling-PDF
      UI_HOMEDESCRIPTION: Ultra-lite version of Stirling-PDF
      UI_APPNAMENAVBAR: Stirling-PDF Ultra-lite
      SYSTEM_MAXFILESIZE: "50"
    networks:
      - stirling-network

networks:
  stirling-network:
    driver: bridge
