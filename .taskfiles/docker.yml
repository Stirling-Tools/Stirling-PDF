version: '3'

vars:
  COMPOSE_DIR: docker/compose
  EMBEDDED_DIR: docker/embedded
  ENGINE_DIR: docker/engine

tasks:
  check:
    desc: "Check Docker image definitions"
    cmds:
      - docker build --check -f docker/base/Dockerfile docker/base
      - docker build --check -f docker/backend/Dockerfile .
      # Supabase publishable keys are public browser configuration.
      - docker build --check --build-arg BUILDKIT_DOCKERFILE_CHECK=skip=SecretsUsedInArgOrEnv -f docker/embedded/Dockerfile .
      - docker build --check --build-arg BUILDKIT_DOCKERFILE_CHECK=skip=SecretsUsedInArgOrEnv -f docker/embedded/Dockerfile.fat .
      - docker build --check -f docker/embedded/Dockerfile.ultra-lite .
      - docker build --check -f docker/engine/Dockerfile .
      - docker build --check -f docker/engine/Dockerfile.dev .
      - docker build --check -f docker/unoserver/Dockerfile .

  build:base:
    desc: "Build shared PDF tools image"
    cmds:
      - docker build --pull -t stirling-pdf-base:local -f docker/base/Dockerfile docker/base

  build:
    desc: "Build standard Docker image"
    cmds:
      - docker build -t stirling-pdf -f {{.EMBEDDED_DIR}}/Dockerfile .

  build:fat:
    desc: "Build fat Docker image (all features)"
    cmds:
      - docker build -t stirling-pdf-fat -f {{.EMBEDDED_DIR}}/Dockerfile.fat .

  build:ultra-lite:
    desc: "Build ultra-lite Docker image"
    cmds:
      - docker build -t stirling-pdf-ultra-lite -f {{.EMBEDDED_DIR}}/Dockerfile.ultra-lite .

  build:backend:
    desc: "Build backend-only Docker image (no embedded frontend)"
    cmds:
      - docker build -t stirling-pdf-backend -f docker/backend/Dockerfile .

  build:frontend:
    desc: "Build frontend-only Docker image"
    cmds:
      - docker build -t stirling-pdf-frontend -f docker/frontend/Dockerfile .

  build:engine:
    desc: "Build engine Docker image"
    cmds:
      - docker build -t stirling-pdf-engine -f {{.ENGINE_DIR}}/Dockerfile .

  build:engine:dev:
    desc: "Build engine development Docker image"
    cmds:
      - docker build -t stirling-pdf-engine-dev -f {{.ENGINE_DIR}}/Dockerfile.dev .

  up:
    desc: "Start standard docker compose stack"
    cmds:
      - docker compose -f {{.COMPOSE_DIR}}/docker-compose.yml up -d

  up:fat:
    desc: "Start fat docker compose stack"
    cmds:
      - docker compose -f {{.COMPOSE_DIR}}/docker-compose.fat.yml up -d

  up:ultra-lite:
    desc: "Start ultra-lite docker compose stack"
    cmds:
      - docker compose -f {{.COMPOSE_DIR}}/docker-compose.ultra-lite.yml up -d

  down:
    desc: "Stop all running docker compose stacks"
    cmds:
      - docker compose -f {{.COMPOSE_DIR}}/docker-compose.yml down

  logs:
    desc: "Tail docker compose logs"
    cmds:
      - docker compose -f {{.COMPOSE_DIR}}/docker-compose.yml logs -f

  test:
    desc: "Run full Docker integration test suite (builds all variants and tests them)"
    ignore_error: true
    cmds:
      - bash testing/test.sh {{.CLI_ARGS}}
