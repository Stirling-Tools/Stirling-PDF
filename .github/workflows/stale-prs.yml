name: Stale PR triage

# Dry run unless the STALE_PR_BOT_LIVE repository variable is "true"; unsetting it
# is the kill switch. The size limit's part has its own, PR_SIZE_BOT_LIVE. The rules
# live in .github/scripts/stale-prs.ts.

on:
  schedule:
    - cron: "40 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would happen without changing any PR"
        type: boolean
        default: true
  pull_request:
    paths:
      - ".github/workflows/stale-prs.yml"
      - ".github/scripts/*.ts"
      - ".github/workflows/pr-turn-labels.yml"
      - ".github/workflows/pr-review-events.yml"
      - ".github/scripts/package.json"
      - ".github/scripts/package-lock.json"
      - ".github/scripts/tsconfig.json"
      - ".github/workflows/pr-conflict-labeler.yml"
      - ".github/workflows/pr-size-limit.yml"

permissions:
  contents: read

concurrency:
  group: stale-prs-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'triage' }}
  cancel-in-progress: false

jobs:
  test:
    name: Test the triage rules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out the scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      # Same Node as github-script v9, so the tests load the .ts the way the bot does.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: .github/scripts/package-lock.json

      - name: Install TypeScript
        working-directory: .github/scripts
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: npm ci --ignore-scripts --audit=false --fund=false

      - name: Typecheck
        working-directory: .github/scripts
        run: npx tsc --noEmit

      - name: Run unit tests
        run: node --test .github/scripts/*.test.ts

      - name: Dry run against open PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: triage } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/stale-prs.ts`);
            await triage({ github, context, core, live: false, sizeLive: false });

  triage:
    name: Warn and close stale PRs
    if: github.event_name != 'pull_request' && vars.CI_PROFILE != 'lite'
    runs-on: ubuntu-latest
    permissions:
      contents: read # actions/checkout
      issues: write # comment on and label PRs
      pull-requests: write # close PRs
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out the scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Triage open PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LIVE: ${{ vars.STALE_PR_BOT_LIVE == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
          SIZE_LIVE: ${{ vars.PR_SIZE_BOT_LIVE == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { default: triage } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/stale-prs.ts`);
            await triage({ github, context, core, live: process.env.LIVE === "true", sizeLive: process.env.SIZE_LIVE === "true" });
