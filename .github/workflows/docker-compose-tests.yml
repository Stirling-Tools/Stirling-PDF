name: Docker Compose Cucumber tests

# Reusable workflow called from build.yml when project / docker / testing
# sources change. Builds the two test images in parallel, then fans the
# existing compose suites out across isolated runners.
on:
  workflow_call:
    inputs:
      docker-base-changed:
        description: "Whether the docker base image changed (forwarded from files-changed)."
        required: false
        type: string
        default: "false"

permissions:
  contents: read

jobs:
  build-images:
    name: Build test image (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ultra-lite
            image-ref: docker.stirlingpdf.com/stirlingtools/stirling-pdf:ultra-lite
            boringcache-directory: .github/boringcache/docker-ultra-lite
          - image: fat
            image-ref: docker.stirlingpdf.com/stirlingtools/stirling-pdf:fat
            boringcache-directory: .github/boringcache/docker-fat
    env:
      BORINGCACHE_ENABLED: ${{ vars.BORINGCACHE_ENABLED == 'true' && (secrets.BORINGCACHE_RESTORE_TOKEN != '' || (github.event_name != 'pull_request' && secrets.BORINGCACHE_SAVE_TOKEN != '')) && 'true' || 'false' }}
    permissions:
      actions: write
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Restore Gradle dependencies with BoringCache
        if: env.BORINGCACHE_ENABLED == 'true'
        uses: boringcache/one@71fdb67f0aa0afc1c4ac616c8c57d0d535f15bd9 # v1.19.2
        with:
          trust-policy: auto
          setup: none
          mode: archive
          cache-profiles: gradle-dependencies
          metadata-hints: workflow=docker-compose-tests,stage=build,image=${{ matrix.image }}
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ github.event_name != 'pull_request' && secrets.BORINGCACHE_SAVE_TOKEN || '' }}

      - name: Configure Gradle build cache with BoringCache
        if: env.BORINGCACHE_ENABLED == 'true'
        uses: boringcache/one@71fdb67f0aa0afc1c4ac616c8c57d0d535f15bd9 # v1.19.2
        with:
          trust-policy: auto
          setup: none
          mode: gradle
          metadata-hints: workflow=docker-compose-tests,stage=build,image=${{ matrix.image }}
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ github.event_name != 'pull_request' && secrets.BORINGCACHE_SAVE_TOKEN || '' }}

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Cache Gradle User Home
        if: env.BORINGCACHE_ENABLED != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ runner.arch }}-jdk-25-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'buildSrc/**', 'settings.gradle', 'build.gradle', 'app/**/build.gradle', 'gradle/**/*.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ runner.arch }}-jdk-25-
            gradle-${{ runner.os }}-${{ runner.arch }}-

      # The fat build uses the daemon-local base when that Dockerfile changed.
      # Ultra-lite has no dependency on that base and can keep its cache-backed
      # container builder even on a base-changing pull request.
      - name: Build changed Docker base with BoringCache
        id: boringcache-base
        if: inputs.docker-base-changed == 'true' && matrix.image == 'fat' && env.BORINGCACHE_ENABLED == 'true'
        uses: boringcache/one@71fdb67f0aa0afc1c4ac616c8c57d0d535f15bd9 # v1.19.2
        with:
          trust-policy: auto
          setup: none
          mode: docker
          proxy-port: 22245
          working-directory: .github/boringcache/docker-base
          docker-command: build
          context: ../../../docker/base
          dockerfile: Dockerfile
          image: stirling-pdf-base
          tags: local
          load: true
          push: false
          provenance: false
          build-args: ENABLE_CCACHE=true
          docker-tool-cache: ccache:stirling-docker-base-ccache
          docker-mount-cache: true
          diagnostics: summary
          metadata-hints: workflow=docker-compose-tests,stage=base,image=fat
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ github.event_name != 'pull_request' && secrets.BORINGCACHE_SAVE_TOKEN || '' }}

      - name: Set up Docker Buildx
        if: (inputs.docker-base-changed != 'true' || matrix.image != 'fat') && env.BORINGCACHE_ENABLED != 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Set up Docker cache with BoringCache
        id: boringcache-docker
        if: (inputs.docker-base-changed != 'true' || matrix.image != 'fat') && env.BORINGCACHE_ENABLED == 'true'
        uses: boringcache/one@71fdb67f0aa0afc1c4ac616c8c57d0d535f15bd9 # v1.19.2
        with:
          trust-policy: auto
          setup: none
          mode: docker
          proxy-port: 22244
          working-directory: ${{ matrix.boringcache-directory }}
          docker-command: setup
          docker-mount-cache: true
          metadata-hints: workflow=docker-compose-tests,stage=build,image=${{ matrix.image }}
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ github.event_name != 'pull_request' && secrets.BORINGCACHE_SAVE_TOKEN || '' }}

      - name: Expose GitHub runtime for Buildx cache
        if: (inputs.docker-base-changed != 'true' || matrix.image != 'fat') && env.BORINGCACHE_ENABLED != 'true'
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      # The BoringCache-owned base build uses its managed BuildKit builder, but
      # the following fat build must resolve the loaded base from Docker's local
      # image store. Switch back to the daemon builder before invoking test.sh.
      - name: Select daemon builder for local base image
        if: inputs.docker-base-changed == 'true' && matrix.image == 'fat'
        run: docker buildx use default

      - name: Build ${{ matrix.image }} test image
        run: |
          chmod +x ./testing/test.sh
          ./testing/test.sh --build-only "$IMAGE"
        env:
          IMAGE: ${{ matrix.image }}
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_PUBLIC_URL: ${{ secrets.MAVEN_PUBLIC_URL }}
          DOCKER_BASE_CHANGED: ${{ inputs.docker-base-changed }}
          DOCKER_BASE_PREBUILT: ${{ steps.boringcache-base.outcome == 'success' && 'true' || 'false' }}
          BORINGCACHE_DOCKER_CACHE_FROM_ULTRA_LITE: ${{ steps.boringcache-docker.outputs.cache-from }}
          BORINGCACHE_DOCKER_CACHE_TO_ULTRA_LITE: ${{ steps.boringcache-docker.outputs.cache-to }}
          BORINGCACHE_DOCKER_CACHE_FROM_FAT: ${{ steps.boringcache-docker.outputs.cache-from }}
          BORINGCACHE_DOCKER_CACHE_TO_FAT: ${{ steps.boringcache-docker.outputs.cache-to }}

      - name: Pack ${{ matrix.image }} test image
        env:
          IMAGE: ${{ matrix.image }}
          IMAGE_REF: ${{ matrix.image-ref }}
        run: |
          mkdir -p "$RUNNER_TEMP/compose-image"
          docker image inspect "$IMAGE_REF" > /dev/null
          docker save "$IMAGE_REF" | gzip -1 > "$RUNNER_TEMP/compose-image/$IMAGE.tar.gz"
          ls -lh "$RUNNER_TEMP/compose-image/$IMAGE.tar.gz"

      - name: Upload ${{ matrix.image }} test image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-compose-image-${{ matrix.image }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/compose-image/${{ matrix.image }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload image build reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-compose-build-reports-${{ matrix.image }}-${{ github.run_attempt }}
          path: testing/reports/
          retention-days: 7
          if-no-files-found: warn

  test-suites:
    name: Test compose suite (${{ matrix.name }})
    needs: build-images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ultra-lite
            image: ultra-lite
            image-ref: docker.stirlingpdf.com/stirlingtools/stirling-pdf:ultra-lite
            tests: Stirling-PDF-Ultra-Lite,Webpage-Accessibility-lite,Stirling-PDF-Ultra-Lite-Version-Check
            cucumber: "false"
          - name: fat-smoke
            image: fat
            image-ref: docker.stirlingpdf.com/stirlingtools/stirling-pdf:fat
            tests: Stirling-PDF-Security-Fat,Webpage-Accessibility-full,Stirling-PDF-Security-Fat-Version-Check
            cucumber: "false"
          - name: cucumber
            image: fat
            image-ref: docker.stirlingpdf.com/stirlingtools/stirling-pdf:fat
            tests: Stirling-PDF-Security-Fat-with-login
            cucumber: "true"
          - name: disabled-endpoints
            image: fat
            image-ref: docker.stirlingpdf.com/stirlingtools/stirling-pdf:fat
            tests: Stirling-PDF-Fat-Disable-Endpoints,Disabled-Endpoints,Stirling-PDF-Fat-Disable-Endpoints-Version-Check
            cucumber: "false"
    env:
      BORINGCACHE_ENABLED: ${{ vars.BORINGCACHE_ENABLED == 'true' && (secrets.BORINGCACHE_RESTORE_TOKEN != '' || (github.event_name != 'pull_request' && secrets.BORINGCACHE_SAVE_TOKEN != '')) && 'true' || 'false' }}
    permissions:
      actions: write
      contents: read
      checks: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download ${{ matrix.image }} test image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-compose-image-${{ matrix.image }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/compose-image

      - name: Load ${{ matrix.image }} test image
        env:
          IMAGE: ${{ matrix.image }}
          IMAGE_REF: ${{ matrix.image-ref }}
        run: |
          docker load --input "$RUNNER_TEMP/compose-image/$IMAGE.tar.gz"
          docker image inspect "$IMAGE_REF" > /dev/null

      - name: Restore build dependencies with BoringCache
        if: env.BORINGCACHE_ENABLED == 'true'
        uses: boringcache/one@71fdb67f0aa0afc1c4ac616c8c57d0d535f15bd9 # v1.19.2
        with:
          trust-policy: auto
          setup: none
          mode: archive
          cache-profiles: gradle-dependencies,uv-dependencies
          metadata-hints: workflow=docker-compose-tests,stage=test,suite=${{ matrix.name }}
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ github.event_name != 'pull_request' && secrets.BORINGCACHE_SAVE_TOKEN || '' }}

      - name: Configure Gradle build cache with BoringCache
        if: env.BORINGCACHE_ENABLED == 'true'
        uses: boringcache/one@71fdb67f0aa0afc1c4ac616c8c57d0d535f15bd9 # v1.19.2
        with:
          trust-policy: auto
          setup: none
          mode: gradle
          metadata-hints: workflow=docker-compose-tests,stage=test,suite=${{ matrix.name }}
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ github.event_name != 'pull_request' && secrets.BORINGCACHE_SAVE_TOKEN || '' }}

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Cache Gradle User Home
        if: env.BORINGCACHE_ENABLED != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ runner.arch }}-jdk-25-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'buildSrc/**', 'settings.gradle', 'build.gradle', 'app/**/build.gradle', 'gradle/**/*.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ runner.arch }}-jdk-25-
            gradle-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Docker Compose
        run: |
          sudo curl -SL "https://github.com/docker/compose/releases/download/v2.39.4/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Install uv
        if: matrix.cucumber == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: ${{ env.BORINGCACHE_ENABLED != 'true' }}
          cache-dependency-glob: |
            engine/pyproject.toml
            engine/uv.lock

      - name: Install Cucumber and coverage dependencies
        if: matrix.cucumber == 'true'
        run: uv sync --project engine --locked --group cucumber --group tools

      - name: Extract JaCoCo agent for cucumber coverage
        if: matrix.cucumber == 'true'
        run: ./gradlew copyJacocoAgent -PnoSpotless

      - name: Run ${{ matrix.name }} compose tests
        env:
          COMPOSE_TESTS: ${{ matrix.tests }}
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_PUBLIC_URL: ${{ secrets.MAVEN_PUBLIC_URL }}
          STIRLING_PDF_TEST_COVERAGE: ${{ matrix.cucumber == 'true' && '1' || '' }}
        run: |
          chmod +x ./testing/test_webpages.sh
          chmod +x ./testing/test.sh
          chmod +x ./testing/test_disabledEndpoints.sh
          ./testing/test.sh --use-existing-image --rerun "$COMPOSE_TESTS"

      - name: Generate cucumber JaCoCo report
        if: always() && matrix.cucumber == 'true'
        id: cucumber-coverage
        run: |
          if [ -s testing/cucumber-coverage/cucumber.exec ]; then
            ./gradlew jacocoReportFromExec \
              -PexecFile=testing/cucumber-coverage/cucumber.exec \
              -PreportDir=build/reports/jacoco/cucumber \
              -PnoSpotless
            echo "report=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No cucumber .exec at testing/cucumber-coverage/cucumber.exec (container may have crashed before flushing)"
            echo "report=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cucumber coverage step summary
        if: always() && matrix.cucumber == 'true' && steps.cucumber-coverage.outputs.report == 'true'
        run: |
          uv run --project engine --locked --group tools python scripts/coverage-summary.py \
            --title "Cucumber (docker) JaCoCo coverage" \
            --jacoco "cucumber=build/reports/jacoco/cucumber/jacocoTestReport.xml" \
            --github-step-summary

      - name: Upload cucumber JaCoCo report
        if: always() && matrix.cucumber == 'true' && steps.cucumber-coverage.outputs.report == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-cucumber-${{ github.run_id }}
          path: build/reports/jacoco/cucumber/
          retention-days: 7

      - name: Upload raw cucumber .exec for aggregate merge
        if: always() && matrix.cucumber == 'true' && steps.cucumber-coverage.outputs.report == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-exec-cucumber
          path: testing/cucumber-coverage/cucumber.exec
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Cucumber Report
        if: always() && matrix.cucumber == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cucumber-report
          path: testing/cucumber/report.html
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-compose-test-reports-${{ matrix.name }}-${{ github.run_attempt }}
          path: testing/reports/
          retention-days: 7
          if-no-files-found: warn

      - name: Cucumber Test Report
        if: always() && matrix.cucumber == 'true'
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Cucumber Tests
          path: testing/cucumber/junit/*.xml
          reporter: java-junit
          fail-on-error: false
