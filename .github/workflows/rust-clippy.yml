name: Rust Clippy

# Reusable workflow called from build.yml when desktop / Rust sources change.
#
# Clippy only analyses the `cfg` branches for the host it runs on, and the
# Tauri crate carries Linux-, macOS- and Windows-only modules. The matrix
# therefore runs on all three so every platform branch is linted where it
# actually compiles, including the Windows-only thumbnail handler crate.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  clippy:
    name: Clippy (${{ matrix.os }})
    # Matches tauri-build's matrix gate: the lite CI profile skips desktop work.
    if: ${{ vars.CI_PROFILE != 'lite' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Cargo build scripts run third-party code; none of it needs the token.
          persist-credentials: false

      - name: Install dependencies (ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libjavascriptcoregtk-4.0-dev libsoup2.4-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          toolchain: stable
          components: clippy

      # Registry + compiled dependencies; a cold Clippy run rebuilds the whole
      # Tauri graph, which is what dominates this job.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            frontend/src-tauri
            frontend/src-tauri/provisioner
            frontend/src-tauri/thumbnail-handler
          shared-key: rust-clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.54.0

      - name: Run Clippy
        run: task desktop:clippy
