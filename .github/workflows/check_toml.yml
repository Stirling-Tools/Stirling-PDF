name: Check TOML Translation Files on PR

# This workflow validates TOML translation files

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "frontend/editor/public/locales/*/translation.toml"
      - ".github/scripts/check_language_toml.py"
      - ".github/workflows/check_toml.yml"

# cancel in-progress jobs if a new job is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # Allow read access to repository content

jobs:
  check-files:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read # Checkout, and read translation files via the contents API
      issues: write # Allow posting comments on issues/PRs
      pull-requests: write # Allow writing to pull requests
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout main branch first
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch changed translation files
        id: fetch-files
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");
            const path = require("path");

            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const LOCALE_FILE = /^frontend\/editor\/public\/locales\/[a-zA-Z-]+\/translation\.toml$/;
            const REFERENCE_FILE = "frontend/editor/public/locales/en-US/translation.toml";

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const changedFiles = files.filter(file => file.status !== "removed" && LOCALE_FILE.test(file.filename));
            if (changedFiles.length === 0) {
              console.log("No translation files changed.");
              core.setOutput("has_files", "false");
              return;
            }

            // The PR's own changes are diffed from the merge base, or keys main changed after the PR branched count as
            // the PR's. They are judged against main's en-US, which the checkout already holds.
            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: `${pr.base.sha}...${pr.head.sha}`,
            });
            const mergeBase = comparison.merge_base_commit.sha;

            // PR content is only ever read through the API as data: this job runs with write permissions.
            const download = async (filePath, ref, destination) => {
              const { data } = await github.rest.repos.getContent({
                owner,
                repo,
                path: filePath,
                ref,
                mediaType: { format: "raw" }, // the default JSON form returns no content for files over 1 MB
              });
              fs.mkdirSync(path.dirname(destination), { recursive: true });
              fs.writeFileSync(destination, Buffer.from(data));
            };

            await download(REFERENCE_FILE, pr.head.sha, path.join("pr-head", REFERENCE_FILE));
            await download(REFERENCE_FILE, mergeBase, path.join("pr-base", REFERENCE_FILE));
            for (const file of changedFiles) {
              await download(file.filename, pr.head.sha, path.join("pr-head", file.filename));
              if (file.status !== "added") {
                await download(file.previous_filename ?? file.filename, mergeBase, path.join("pr-base", file.filename));
              }
            }

            console.log(`Merge base: ${mergeBase}`);
            console.log("Changed files:", changedFiles.map(file => file.filename));
            core.setOutput("has_files", "true");

      - name: Install uv
        if: steps.fetch-files.outputs.has_files == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            engine/pyproject.toml
            engine/uv.lock

      - name: Install Python dependencies
        if: steps.fetch-files.outputs.has_files == 'true'
        run: |
          uv sync --project engine --locked --group tools

      - name: Check translation files
        id: run-check
        if: steps.fetch-files.outputs.has_files == 'true'
        env:
          PR_ACTOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -o pipefail
          uv run --project engine --locked --group tools python .github/scripts/check_language_toml.py check \
            --base-dir pr-base \
            --head-dir pr-head \
            --main-dir . \
            --actor "${PR_ACTOR}" | tee report.md
        continue-on-error: true

      - name: Post comment on PR
        if: steps.run-check.outcome == 'success' || steps.run-check.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHECK_FAILED: ${{ steps.run-check.outcome == 'failure' }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");

            // Empty when the script crashed rather than reporting; the failed step's log has the traceback.
            const report = fs.existsSync("report.md") ? fs.readFileSync("report.md", "utf8").trim() : "";
            if (!report) {
              console.log("No report to post.");
              return;
            }

            const HEADER = "## 🌐 TOML Translation Verification Summary";
            const MAX_COMMENT_LENGTH = 65536;
            const truncationNote = "\n\n_Report truncated: the full report is in the workflow run's log._";
            let body = `${HEADER}\n\n${report}\n`;
            if (body.length > MAX_COMMENT_LENGTH) {
              body = body.slice(0, MAX_COMMENT_LENGTH - truncationNote.length) + truncationNote;
            }

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(c => c.user.login === "github-actions[bot]" && c.body.includes(HEADER));

            // Passing PRs get no new comment; an earlier failure comment is updated so it never goes stale.
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              console.log("Updated existing comment.");
            } else if (process.env.CHECK_FAILED === "true") {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              console.log("Created new comment.");
            }

      - name: Fail job if errors found
        if: steps.run-check.outcome == 'failure'
        run: exit 1
