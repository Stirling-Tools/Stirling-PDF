name: Playwright E2E (stubbed)

# Reusable workflow called from build.yml. Backend-free Playwright suite: no
# Spring Boot required, the `stubbed` projects mock API responses in the
# browser.
#
# The suite is ~1000 tests. One job per browser on a 2-core runner took 30-50
# minutes and was the longest job in every PR run, so each browser is split
# into Playwright shards (`--shard=i/n`) that each run on their own runner;
# the shard list in the matrix is the single place to change the count.
# The disk-link suite needs a desktop-mode bundle, so it is its own leg
# instead of tailing the first chromium shard.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  playwright-e2e:
    name: playwright-e2e (${{ matrix.browser }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The image already contains the Playwright browsers and all Linux
    # dependencies, so no leg pays for `playwright install --with-deps`.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
    strategy:
      # One leg breaking must not mask a failure in another - report all.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        # One Playwright shard per entry, the same count for every browser.
        # Playwright splits shards by test count, so legs grow with the suite;
        # add an entry when the slowest leg passes about 15 minutes.
        shard: ["1/5", "2/5", "3/5", "4/5", "5/5"]
        include:
          - { browser: chromium, project: stubbed }
          - { browser: firefox, project: stubbed-firefox }
          - { browser: webkit, project: stubbed-webkit }
          # A `shard` value outside the list above makes this a standalone
          # leg instead of an addition to every shard. The disk-link suite
          # exercises a seam chosen at build time, so it needs a desktop-mode
          # bundle of its own. Chromium only: it is not testing engine
          # behaviour.
          - { browser: chromium, shard: disk-link, project: stubbed-desktop, suite: desktop }
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history so the flaky gate can diff a PR against its base sha.
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      # Every leg needs this, the disk-link one included: the OG prerender
      # plugin in vite.config.ts reads dist/index.html whatever --outDir the
      # desktop build was given.
      - name: Build frontend (production bundle for vite preview)
        env:
          VITE_BUILD_FOR_PREVIEW: "1"
          VITE_INCLUDE_PORTAL: "true"
        run: task frontend:build:proprietary
      - name: Run stubbed E2E tests (${{ matrix.browser }} ${{ matrix.shard }})
        if: matrix.suite != 'desktop'
        env:
          # The official Playwright image expects its browser runtime under
          # the root home directory. Keep this scoped to Playwright and use a
          # neutral Docker config path so Docker does not read /root/.docker.
          HOME: /root
          DOCKER_CONFIG: /tmp/playwright-docker-config
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/frontend/playwright-report/results.json
          NPM_CONFIG_PREFER_OFFLINE: "true"
          NPM_CONFIG_FETCH_RETRIES: "5"
          NPM_CONFIG_FETCH_RETRY_FACTOR: "2"
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "1000"
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
        run: task e2e:stubbed-project PROJECT=${{ matrix.project }} -- --workers=3 ${{ contains(matrix.shard, '/') && format('--shard={0}', matrix.shard) || '' }}
      - name: Build frontend (desktop mode, for the disk-link suite)
        if: matrix.suite == 'desktop'
        env:
          VITE_BUILD_FOR_PREVIEW: "1"
        run: task frontend:build:desktop:e2e
      - name: Run disk-link E2E tests (desktop mode)
        if: matrix.suite == 'desktop'
        env:
          HOME: /root
          DOCKER_CONFIG: /tmp/playwright-docker-config
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/frontend/playwright-report/results.json
        run: task e2e:stubbed-desktop -- --workers=3
      - name: Flag flaky tests
        if: always()
        working-directory: frontend
        run: npx tsx editor/scripts/report-flaky-tests.mts "$PLAYWRIGHT_JSON_OUTPUT_FILE"
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/frontend/playwright-report/results.json
          FLAKY_STRICT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # job-index because `shard` holds a slash, which artifact names reject.
          name: playwright-report-stubbed-${{ matrix.browser }}-${{ strategy.job-index }}-${{ github.run_id }}
          path: frontend/playwright-report/
          retention-days: 7
