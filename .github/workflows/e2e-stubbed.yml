name: Playwright E2E (stubbed)

# Reusable workflow called from build.yml. Backend-free Playwright suite: no
# Spring Boot required, the `stubbed` projects mock API responses in the
# browser.
#
# The suite is ~1000 tests. One job per browser on a 2-core runner took 30-50
# minutes and was the longest job in every PR run, so each browser is split
# into Playwright shards (`--shard=i/n`) that each run on their own runner;
# the matrix is the single place to change the counts.
# The disk-link suite needs a desktop-mode bundle, so it is its own leg
# instead of tailing the first chromium shard.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  playwright-e2e:
    name: playwright-e2e (${{ matrix.browser }} ${{ matrix.group }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The image already contains the Playwright browsers and all Linux
    # dependencies, so no leg pays for `playwright install --with-deps`.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
    strategy:
      # One leg breaking must not mask a failure in another - report all.
      fail-fast: false
      matrix:
        # One Playwright shard of one group per entry. Playwright splits shards
        # by test count in file order, and a PDF text editor test takes 2-3x
        # as long as an average one (it loads the document into both the viewer
        # and the editor), so in shared shards they all land in the same two
        # legs. Each group is sharded on its own so its legs come out even.
        # Counts differ per browser because webkit takes about 2.5x as long as
        # chromium; add a shard to whichever group has the slowest leg.
        include:
          - { browser: chromium, project: stubbed, group: text-editor, shard: 1/2 }
          - { browser: chromium, project: stubbed, group: text-editor, shard: 2/2 }
          - { browser: chromium, project: stubbed, group: other, shard: 1/2 }
          - { browser: chromium, project: stubbed, group: other, shard: 2/2 }
          - { browser: firefox, project: stubbed-firefox, group: text-editor, shard: 1/3 }
          - { browser: firefox, project: stubbed-firefox, group: text-editor, shard: 2/3 }
          - { browser: firefox, project: stubbed-firefox, group: text-editor, shard: 3/3 }
          - { browser: firefox, project: stubbed-firefox, group: other, shard: 1/2 }
          - { browser: firefox, project: stubbed-firefox, group: other, shard: 2/2 }
          - { browser: webkit, project: stubbed-webkit, group: text-editor, shard: 1/4 }
          - { browser: webkit, project: stubbed-webkit, group: text-editor, shard: 2/4 }
          - { browser: webkit, project: stubbed-webkit, group: text-editor, shard: 3/4 }
          - { browser: webkit, project: stubbed-webkit, group: text-editor, shard: 4/4 }
          - { browser: webkit, project: stubbed-webkit, group: other, shard: 1/2 }
          - { browser: webkit, project: stubbed-webkit, group: other, shard: 2/2 }
          # The disk-link suite exercises a seam chosen at build time, so it
          # needs a desktop-mode bundle of its own. Chromium only: it is not
          # testing engine behaviour.
          - { browser: chromium, project: stubbed-desktop, group: disk-link, shard: 1/1, suite: desktop }
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the flaky gate can diff a PR against its base sha.
          fetch-depth: 0
          # Blobs load lazily; full-history fetch otherwise pulls every branch's files.
          filter: blob:none
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.54.0
      # Every leg needs this, the disk-link one included: the OG prerender
      # plugin in vite.config.ts reads dist/index.html whatever --outDir the
      # desktop build was given.
      - name: Build frontend (production bundle for vite preview)
        env:
          VITE_BUILD_FOR_PREVIEW: "1"
          VITE_INCLUDE_PORTAL: "true"
        run: task frontend:build:proprietary
      - name: Run stubbed E2E tests (${{ matrix.browser }} ${{ matrix.group }} ${{ matrix.shard }})
        if: matrix.suite != 'desktop'
        env:
          # Matched against each test's title path, which includes its file.
          # One pattern serves as --grep for one group and --grep-invert for
          # the other, so together they run every test exactly once.
          TEXT_EDITOR_SPECS: 'pdf-text-editor\S*\.spec\.ts'
          # The official Playwright image expects its browser runtime under
          # the root home directory. Keep this scoped to Playwright and use a
          # neutral Docker config path so Docker does not read /root/.docker.
          HOME: /root
          DOCKER_CONFIG: /tmp/playwright-docker-config
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/frontend/playwright-report/results.json
          NPM_CONFIG_PREFER_OFFLINE: "true"
          NPM_CONFIG_FETCH_RETRIES: "5"
          NPM_CONFIG_FETCH_RETRY_FACTOR: "2"
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "1000"
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
        run: task e2e:stubbed-project PROJECT=${{ matrix.project }} -- --workers=3 --shard=${{ matrix.shard }} ${{ matrix.group == 'text-editor' && '--grep' || '--grep-invert' }} "$TEXT_EDITOR_SPECS"
      - name: Build frontend (desktop mode, for the disk-link suite)
        if: matrix.suite == 'desktop'
        env:
          VITE_BUILD_FOR_PREVIEW: "1"
        run: task frontend:build:desktop:e2e
      - name: Run disk-link E2E tests (desktop mode)
        if: matrix.suite == 'desktop'
        env:
          HOME: /root
          DOCKER_CONFIG: /tmp/playwright-docker-config
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/frontend/playwright-report/results.json
        run: task e2e:stubbed-desktop -- --workers=3
      - name: Flag flaky tests
        if: always()
        working-directory: frontend
        run: npx tsx scripts/report-flaky-tests.mts "$PLAYWRIGHT_JSON_OUTPUT_FILE"
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/frontend/playwright-report/results.json
          FLAKY_STRICT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # job-index because `shard` holds a slash, which artifact names reject.
          name: playwright-report-stubbed-${{ matrix.browser }}-${{ strategy.job-index }}-${{ github.run_id }}
          path: frontend/playwright-report/
          retention-days: 7
