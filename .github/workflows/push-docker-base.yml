name: Push Docker Base Image

on:
  push:
    branches:
      - baseDockerImage
      - accessIssueFix
      # TEMP: dry-run timing tests, remove before merge
      - claude/stirling-pdf-workflow-perf-549ddd
  workflow_dispatch:
    inputs:
      version:
        description: 'Base image version (e.g., 1.0.0, 1.0.1)'
        required: true
        type: string

permissions:
  contents: read

env:
  # Other branches build both arches and test the merge locally without publishing.
  PUBLISH: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'baseDockerImage' || github.ref_name == 'accessIssueFix' }}

jobs:
  # Each arch builds on its own native runner; QEMU made arm64 take ~100 minutes.
  build:
    name: build (${{ matrix.platform }})
    # Own environment: docker-publish is branch-locked to release/main,
    # which excludes the baseDockerImage/accessIssueFix branches this runs on.
    environment: ${{ (github.event_name == 'workflow_dispatch' || github.ref_name == 'baseDockerImage' || github.ref_name == 'accessIssueFix') && 'docker-base-publish' || '' }}
    if: ${{ vars.CI_PROFILE != 'lite' && github.actor == 'Frooodle' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04-8core
          - platform: linux/arm64/v8
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Verify authorized user
        run: |
          if [ "${{ github.actor }}" != "Frooodle" ]; then
            echo "Error: Only Frooodle is authorized to run this workflow"
            exit 1
          fi

      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_API }}

      - name: Login to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Convert repository owner to lowercase
        id: repoowner
        run: echo "lowercase=$(echo ${{ github.repository_owner }} | awk '{print tolower($0)}')" >> $GITHUB_OUTPUT

      - name: Image names
        id: names
        env:
          HUB_ORG: ${{ secrets.DOCKER_HUB_ORG_USERNAME }}
        run: |
          echo "images=${HUB_ORG}/stirling-pdf-base,ghcr.io/${{ steps.repoowner.outputs.lowercase }}/stirling-pdf-base" >> $GITHUB_OUTPUT

      - name: Generate labels for base image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.repoowner.outputs.lowercase }}/stirling-pdf-base

      # Pushed untagged by digest; the merge job tags the multi-arch index.
      - name: Build and push base image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: docker/base
          file: ./docker/base/Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=stirling-pdf-base-${{ matrix.arch }}
          # Dry runs skip the export so test branches do not evict shared caches.
          cache-to: ${{ env.PUBLISH == 'true' && format('type=gha,mode=max,scope=stirling-pdf-base-{0}', matrix.arch) || '' }}
          platforms: ${{ matrix.platform }}
          provenance: true
          sbom: true
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,"name={0}",push-by-digest=true,name-canonical=true,push=true', steps.names.outputs.images) || format('type=oci,dest={0}/base-{1}.tar', runner.temp, matrix.arch) }}

      - name: Export digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: base-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload dry-run image
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: base-oci-${{ matrix.arch }}
          path: ${{ runner.temp }}/base-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  merge:
    needs: build
    environment: ${{ (github.event_name == 'workflow_dispatch' || github.ref_name == 'baseDockerImage' || github.ref_name == 'accessIssueFix') && 'docker-base-publish' || '' }}
    if: ${{ vars.CI_PROFILE != 'lite' && github.actor == 'Frooodle' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    services:
      # Throwaway registry so dry runs exercise the same merge without publishing.
      registry:
        image: registry:3
        ports:
          - 5000:5000
    steps:
      - name: Set version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION}"
          elif [ "${{ github.ref_name }}" == "accessIssueFix" ]; then
            VERSION="1.0.3"
          else
            VERSION="1.0.0"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Login to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_API }}

      - name: Login to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Convert repository owner to lowercase
        id: repoowner
        run: echo "lowercase=$(echo ${{ github.repository_owner }} | awk '{print tolower($0)}')" >> $GITHUB_OUTPUT

      - name: Download digests
        if: env.PUBLISH == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: base-digest-*
          merge-multiple: true

      - name: Download dry-run images
        if: env.PUBLISH != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/oci
          pattern: base-oci-*
          merge-multiple: true

      - name: Load dry-run images into local registry
        if: env.PUBLISH != 'true'
        run: |
          set -eux
          mkdir -p "${{ runner.temp }}/digests"
          for arch in amd64 arm64; do
            skopeo copy --all --dest-tls-verify=false \
              "oci-archive:${{ runner.temp }}/oci/base-${arch}.tar" \
              "docker://localhost:5000/stirling-pdf-base:dry-${arch}"
            digest=$(skopeo inspect --raw --tls-verify=false "docker://localhost:5000/stirling-pdf-base:dry-${arch}" | sha256sum | cut -d' ' -f1)
            touch "${{ runner.temp }}/digests/${digest}"
          done

      - name: Image names and tags
        id: names
        env:
          HUB_ORG: ${{ secrets.DOCKER_HUB_ORG_USERNAME }}
          VERSION: ${{ steps.version.outputs.version }}
          OWNER: ${{ steps.repoowner.outputs.lowercase }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            echo "images=${HUB_ORG}/stirling-pdf-base ghcr.io/${OWNER}/stirling-pdf-base" >> $GITHUB_OUTPUT
          else
            echo "images=localhost:5000/stirling-pdf-base" >> $GITHUB_OUTPUT
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create multi-arch manifests
        id: merge
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGES: ${{ steps.names.outputs.images }}
          VERSION: ${{ steps.names.outputs.version }}
        run: |
          set -eux
          tags=""
          for image in $IMAGES; do
            docker buildx imagetools create -t "${image}:${VERSION}" \
              $(printf "${image}@sha256:%s " *)
            docker buildx imagetools inspect "${image}:${VERSION}"
            tags="${tags:+${tags},}${image}:${VERSION}"
          done
          # Same index content in every registry, so one digest signs them all.
          digest=$(docker buildx imagetools inspect "${image}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "tags=${tags}" >> $GITHUB_OUTPUT
          echo "digest=${digest}" >> $GITHUB_OUTPUT

      - name: Verify both platforms are present
        env:
          IMAGES: ${{ steps.names.outputs.images }}
          VERSION: ${{ steps.names.outputs.version }}
        run: |
          set -eu
          for image in $IMAGES; do
            platforms=$(docker buildx imagetools inspect "${image}:${VERSION}" --raw \
              | jq -r '[.manifests[] | select(.platform.os == "linux") | "\(.platform.architecture)"] | sort | join(",")')
            echo "${image}:${VERSION} -> ${platforms}"
            [ "$platforms" = "amd64,arm64" ] || { echo "expected amd64,arm64"; exit 1; }
          done

      - name: Install cosign
        if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.4.1"

      - name: Sign base images
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
          TAGS: ${{ steps.merge.outputs.tags }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -n "$COSIGN_PRIVATE_KEY" ]; then
            echo "$TAGS" | tr ',' '\n' | while read -r tag; do
              cosign sign --yes \
                --key env://COSIGN_PRIVATE_KEY \
                "${tag}@${DIGEST}"
            done
          else
            echo "Warning: COSIGN_PRIVATE_KEY not set, skipping image signing"
          fi
