name: Check generated models

# Verifies the committed generated files are still in sync with the Java OpenAPI
# spec: the request models (toolApiTypes.ts, tool_models.py) and the tool I/O
# tables saying what each endpoint accepts and produces (toolIO.ts, tool_io.py).
# Regenerates them all with the single top-level `task tool-models` and fails if
# any committed file is out of date. Called from build.yml when the
# backend Java, frontend, or engine changes; also runs on push to main as a
# post-merge safety net.
on:
  workflow_call:
    inputs:
      use_shared_cache:
        required: false
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

env:
  TASK_TEMP_DIR: ${{ github.workspace }}/.cache/task/task-state
  JAVA_VERSION: 25
  GRADLE_USER_HOME: ${{ github.workspace }}/.cache/gradle-java-25
  GRADLE_FILES_TO_HASH: |
    gradle/wrapper/gradle-wrapper.properties
    gradle/libs.versions.toml
    buildSrc/**
    settings.gradle
    build.gradle
    app/**/build.gradle
    gradle/**/*.gradle
  FRONTEND_DIST_FILES_TO_HASH: |
    frontend/editor/src/**
  UV_FILES_TO_HASH: |
    engine/.python-version
    engine/pyproject.toml
    engine/uv.lock

jobs:
  hash_pr:
    name: Hash files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      gradle_files_hash: ${{ steps.hash.outputs.gradle_files_hash}}
      uv_files_hash: ${{ steps.hash.outputs.uv_files_hash}}
      frontend_dist_files_hash: ${{ steps.hash.outputs.frontend_dist_files_hash }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Hash Gradle and Cargo files
        id: hash
        env:
          GRADLE_HASH: ${{ hashFiles(env.GRADLE_FILES_TO_HASH) }}
          UV_HASH: ${{ hashFiles(env.UV_FILES_TO_HASH) }}
          FRONTEND_DIST_HASH: ${{ hashFiles(env.FRONTEND_DIST_FILES_TO_HASH) }}
        shell: bash
        run: |
          echo "gradle_files_hash=$GRADLE_HASH" >> "$GITHUB_OUTPUT"
          echo "uv_files_hash=$UV_HASH" >> "$GITHUB_OUTPUT"
          echo "frontend_dist_files_hash=$FRONTEND_DIST_HASH" >> "$GITHUB_OUTPUT"
  generated-models:
    runs-on: ubuntu-latest
    needs: hash_pr
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/setup-uv-cache
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.cache/npm
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout trusted Java action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted-java-action
          sparse-checkout: .github/actions/java
          persist-credentials: false

      - name: Restore Gradle cache github-artifact
        id: cache
        uses: ./.github/actions/cache-the-planet
        with:
          encryption-key: ${{ secrets.CACHE_SFTP_PASSWORD || '' }}
          token: ${{ github.token }}
          multi-cache: |
            frontend-dist:
              path: frontend/editor/dist
            frontend-node-modules:
              path: frontend/node_modules
            npm-cache:
              path: .cache/npm
            tool-models-gradle-caches:
              path: .cache/gradle-java-${{ env.JAVA_VERSION }}/caches
            tool-models-gradle-wrapper:
              path: .cache/gradle-java-${{ env.JAVA_VERSION }}/wrapper
            tool-models-uv-python-dir:
              path: .cache/uv-python-dir
            tool-models-setup-uv-cache:
              path: .cache/setup-uv-cache
            task-cache:
              path: .cache/task/task
            task-state-cache:
              path: .cache/task/task-state
          key: |
            task-cache=${{ hashFiles('.taskfiles/**', 'Taskfile.yml') }}
            task-state-cache=${{ hashFiles('.taskfiles/**', 'Taskfile.yml') }}
            tool-models-gradle-caches=${{ needs.hash_pr.outputs.gradle_files_hash }}
            tool-models-gradle-wrapper=${{ needs.hash_pr.outputs.gradle_files_hash }}
            npm-cache=${{ hashFiles('frontend/package-lock.json') }}
            frontend-dist=${{ needs.hash_pr.outputs.frontend_dist_files_hash }}
            frontend-node-modules=${{ hashFiles('frontend/package-lock.json') }}
            tool-models-setup-uv-cache=${{ needs.hash_pr.outputs.uv_files_hash }}
            tool-models-uv-python-dir=${{ needs.hash_pr.outputs.uv_files_hash }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          cache-dependency-glob: |
            engine/pyproject.toml
            engine/uv.lock
          cache-local-path: .cache/setup-uv-cache

      - name: Set up JDK 25
        uses: ./trusted-java-action/.github/actions/java
        with:
          java-version: "25"

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Verify generated models are up to date
        id: models-check
        continue-on-error: true
        run: task tool-models:check

      - name: Comment on generated models check failure
        # Only post a comment on PRs. github-script's PR helpers need an
        # issue/PR number, which doesn't exist on merge_group runs.
        if: steps.models-check.outcome == 'failure' && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- generated-models-check -->';
            const body = [
              marker,
              '### Generated Models Check Failed',
              '',
              'One or more generated files are out of date with the Java OpenAPI spec and will need to be regenerated before they can be merged in.',
              '',
              'Run `task tool-models` to regenerate them, then commit the updated files.',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if generated models check failed
        if: steps.models-check.outcome == 'failure'
        run: |
          echo "============================================"
          echo "  Generated Models Check Failed"
          echo "============================================"
          echo ""
          echo "One or more generated files are out of date with the Java"
          echo "OpenAPI spec and will need to be regenerated before merging."
          echo ""
          echo "Run 'task tool-models' to regenerate them, then"
          echo "commit the updated files."
          echo "============================================"
          exit 1

      - name: Remove generated models check comment on success
        if: steps.models-check.outcome == 'success' && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- generated-models-check -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
              });
            }
