name: Frontend lint, type-check, and build

# Reusable workflow called from build.yml when frontend / testing sources
# change. Runs `task frontend:check:all` and uploads the
# coverage + dist artifacts for downstream jobs.
on:
  workflow_call:
    inputs:
      frontend-dist-hash:
        required: true
        type: string
      uv-hash:
        required: true
        type: string
      npm-hash:
        required: true
        type: string
      cargo-hash:
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/setup-uv-cache
  UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.cache/uv-python-dir
  NPM_CONFIG_CACHE: ${{ github.workspace }}/.cache/npm
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo

jobs:
  frontend-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore cache artifact
        id: cache
        uses: ./.github/actions/cache-the-planet
        with:
          encryption-key: ${{ secrets.CACHE_SFTP_PASSWORD || '' }}
          token: ${{ github.token }}
          multi-cache: |
            valid-cargo-registry:
              path: .cache/cargo/registry
            valid-cargo-git:
              path: .cache/cargo/git
            valid-cargo-bin:
              path: .cache/cargo/bin
            valid-frontend-dist:
              path: frontend/editor/dist
            valid-frontend-node-modules:
              path: frontend/node_modules
            valid-npm-cache:
              path: .cache/npm
            valid-tauri-target:
              path: frontend/editor/src-tauri/target
            valid-frontend-setup-uv-cache:
              path: .cache/setup-uv-cache
            valid-frontend-uv-python-dir:
              path: .cache/uv-python-dir
          key: |
            valid-cargo-registry=${{ inputs.cargo-hash }}
            valid-cargo-git=${{ inputs.cargo-hash }}
            valid-cargo-bin=${{ inputs.cargo-hash }}
            valid-npm-cache=${{ inputs.npm-hash }}
            valid-frontend-dist=${{ inputs.frontend-dist-hash }}
            valid-frontend-node-modules=${{ inputs.npm-hash }}
            valid-tauri-target=${{ inputs.frontend-dist-hash }}
            valid-frontend-setup-uv-cache=${{ inputs.uv-hash }}
            valid-frontend-uv-python-dir=${{ inputs.uv-hash }}
          exclude: |
            frontend/editor/src-tauri/target/debug/**

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Quality-check frontend
        id: frontend-check
        run: task frontend:check:all
        continue-on-error: true

      - name: Comment on frontend check failure
        # Only post a comment on PRs. github-script's PR helpers need an
        # issue/PR number, which doesn't exist on merge_group runs.
        if: steps.frontend-check.outcome == 'failure' && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- frontend-check -->';
            const body = [
              marker,
              '### Frontend Check Failed',
              '',
              'There are issues with your frontend code that will need to be fixed before they can be merged in.',
              '',
              'Run `task frontend:fix` to auto-fix what can be fixed automatically, then run `task frontend:check:all` to see what still needs fixing manually.',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if frontend check failed
        if: steps.frontend-check.outcome == 'failure'
        run: |
          echo "============================================"
          echo "  Frontend Check Failed"
          echo "============================================"
          echo ""
          echo "There are issues with your frontend code that"
          echo "will need to be fixed before they can be merged in."
          echo ""
          echo "Run 'task frontend:fix' to auto-fix what can be"
          echo "fixed automatically, then run 'task frontend:check:all'"
          echo "to see what still needs fixing manually."
          echo "============================================"
          exit 1

      - name: Remove frontend check comment on success
        if: steps.frontend-check.outcome == 'success' && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- frontend-check -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
              });
            }

      - name: Install uv
        if: always()
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          cache-dependency-glob: |
            engine/pyproject.toml
            engine/uv.lock
          cache-local-path: .cache/setup-uv-cache

      - name: Vitest coverage step summary
        if: always()
        run: |
          uv run --project engine --locked --group tools python scripts/coverage-summary.py \
            --title "Frontend Vitest coverage" \
            --vitest frontend/editor/coverage/coverage-summary.json \
            --github-step-summary

      - name: Upload vitest coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/editor/coverage/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-build
          path: frontend/editor/dist/
          retention-days: 3
