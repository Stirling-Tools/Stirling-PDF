name: Delete closed pull request cache

concurrency:
  group: pr-cache-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Clean up pull request cache
        uses: Ludy87/cache-the-planet/pr-cleanup@v1.8
        env:
          CACHE_STORAGE: sftp
          SFTP_HOST: ${{ secrets.CACHE_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.CACHE_SFTP_PORT || '22' }}
          SFTP_USERNAME: ${{ secrets.CACHE_SFTP_USERNAME }}
          SFTP_PRIVATE_KEY: ${{ secrets.CACHE_SFTP_PRIVATE_KEY }}
          SFTP_PASSWORD: ${{ secrets.CACHE_SFTP_PASSWORD }}
          SFTP_BASE_PATH: ${{ secrets.CACHE_SFTP_BASE_PATH || '/cache-the-planet' }}
          PR_REPOSITORY: ${{ github.event.repository.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
