name: Cache garbage collection
concurrency:
  group: cache-garbage-collection
  cancel-in-progress: false

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Cleanup mode
        required: true
        default: orphan
        type: choice
        options: [expired, orphan, all, object]
      object:
        description: SHA-256 hash or asset filename when mode is object
        required: false
        type: string
      dry_run:
        { description: Dry run, required: false, default: true, type: boolean }
      delete_shared:
        description: Delete all shared cache references and unused shared assets (manual expired mode only)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  gc:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup GitHub App Bot
        id: setup-bot
        uses: ./.github/actions/setup-bot
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          
      - name: Garbage collect cache
        uses: Ludy87/cache-the-planet/gc@7b13e629dbb33bcda505cba4cdb5c6d5898d3168 # v1.7.0
        with:
          repository: Stirling-Tools/Stirling-PDF
          token: ${{ steps.setup-bot.outputs.token }}
          mode: expired
          untrusted-ttl-hours: "24"
          dry-run: "false"