name: DB migration smoke test

# Tests all H2 fixtures and native PostgreSQL upgrades from v2.5.0 onwards.
# Historical releases need PREMIUM_KEY_ENTERPRISE to connect to PostgreSQL.
# Catches schema changes that would break existing user databases under
# Hibernate's `ddl-auto=update` upgrade path.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: 25
  GRADLE_USER_HOME: ${{ github.workspace }}/.cache/gradle-java-25
  GRADLE_FILES_TO_HASH: |
    gradle/wrapper/gradle-wrapper.properties
    gradle/libs.versions.toml
    buildSrc/**
    settings.gradle
    build.gradle
    app/**/build.gradle
    gradle/**/*.gradle

jobs:
  pick:
    uses: ./.github/workflows/_runner-pick.yml

  hash_pr:
    name: Hash files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      gradle_files_hash: ${{ steps.hash.outputs.gradle_files_hash}}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Hash Gradle and Cargo files
        id: hash
        env:
          GRADLE_HASH: ${{ hashFiles(env.GRADLE_FILES_TO_HASH) }}
        shell: bash
        run: |
          echo "gradle_files_hash=$GRADLE_HASH" >> "$GITHUB_OUTPUT"

  migration-test:
    needs: [pick, hash_pr]
    name: DB upgrade (${{ matrix.database }})
    strategy:
      fail-fast: false
      matrix:
        # Historical releases require a license secret unavailable to fork PRs.
        database: ${{ fromJSON(needs.pick.outputs.is_fork == 'true' && '["h2"]' || '["h2", "postgresql"]') }}
    environment:
      name: ci-unsigned
      deployment: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout trusted Java action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted-java-action
          sparse-checkout: .github/actions/java
          persist-credentials: false

      - name: Report PostgreSQL coverage unavailable for forks
        if: needs.pick.outputs.is_fork == 'true'
        run: echo 'PostgreSQL upgrade tests skipped on this fork PR because the enterprise license secret is unavailable. H2 upgrade tests still run.' >> "$GITHUB_STEP_SUMMARY"

      - name: Require license for historical PostgreSQL releases
        if: matrix.database == 'postgresql'
        env:
          PREMIUM_KEY: ${{ secrets.PREMIUM_KEY_ENTERPRISE }}
        run: |
          if [[ -z "$PREMIUM_KEY" ]]; then
            echo '::error::PREMIUM_KEY_ENTERPRISE is required for the PostgreSQL upgrade test.'
            exit 1
          fi

      - name: Restore cache artifact
        id: cache
        uses: ./.github/actions/cache-the-planet
        with:
          encryption-key: ${{ secrets.CACHE_SFTP_PASSWORD || '' }}
          token: ${{ github.token }}
          multi-cache: |
            db-gradle-caches:
              path: .cache/gradle-java-${{ env.JAVA_VERSION }}/caches
            db-gradle-wrapper:
              path: .cache/gradle-java-${{ env.JAVA_VERSION }}/wrapper
          key: |
            db-gradle-caches=${{ needs.hash_pr.outputs.gradle_files_hash }}
            db-gradle-wrapper=${{ needs.hash_pr.outputs.gradle_files_hash }}

      - name: Set up JDK 25
        uses: ./trusted-java-action/.github/actions/java
        with:
          java-version: 25

      # Keep the normal formatting path here so this smoke test exercises the
      # same Gradle configuration as the backend build.
      - name: Build Stirling-PDF JAR
        env:
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_PUBLIC_URL: ${{ secrets.MAVEN_PUBLIC_URL }}
        run: ./gradlew :stirling-pdf:bootJar -PnoSpotless --no-daemon

      - name: Locate built JAR
        id: jar
        run: |
          jar=$(find app/core/build/libs -maxdepth 1 -name 'Stirling-PDF*.jar' -o -name 'stirling-pdf*.jar' 2>/dev/null \
              | grep -vE '(-plain|-sources)\.jar$' | head -n 1)
          if [[ -z "$jar" ]]; then
            echo "::error::No JAR under app/core/build/libs"
            ls -lah app/core/build/libs || true
            exit 1
          fi
          # Absolute path - the migration script pushd's into a temp workdir
          # before invoking java, which would dangle a relative path.
          jar=$(realpath "$jar")
          echo "path=$jar" >> "$GITHUB_OUTPUT"
          echo "Built JAR: $jar"

      - name: Run H2 migration smoke test
        if: matrix.database == 'h2'
        env:
          STIRLING_JAR: ${{ steps.jar.outputs.path }}
        run: bash scripts/db-migration/run-migration-test.sh

      - name: Run PostgreSQL migration smoke test
        if: matrix.database == 'postgresql'
        env:
          STIRLING_JAR: ${{ steps.jar.outputs.path }}
          PREMIUM_KEY: ${{ secrets.PREMIUM_KEY_ENTERPRISE }}
        run: python3 scripts/db-migration/run-postgres-migration-test.py --work-dir "${{ runner.temp }}/db-migration/postgresql"

      - name: Upload app logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: db-migration-${{ matrix.database }}-logs
          # Path matches the preserved workdir in run-migration-test.sh -
          # only failing fixtures leave a directory behind.
          path: |
            /tmp/stirling-migration-failed-*/app.log
            ${{ runner.temp }}/db-migration/postgresql/**/app.log
            ${{ runner.temp }}/db-migration/postgresql/**/postgres.log
          retention-days: 7
          if-no-files-found: warn

      - name: Cleanup temporary files
        if: always()
        run: rm -rf /tmp/stirling-migration-failed-*
        continue-on-error: true
