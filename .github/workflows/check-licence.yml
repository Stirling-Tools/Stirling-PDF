name: License compatibility check

# Reusable workflow called from build.yml when build.gradle / module gradle
# files change. Verifies all transitive dependencies use a permitted license.
on:
  workflow_call:
    inputs:
      gradle-hash:
        required: true
        type: string
      java-version:
        required: false
        default: '25'
        type: string

permissions:
  contents: read

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.cache/gradle-java-${{ inputs.java-version }}

jobs:
  check-licence:
    permissions:
      contents: write
    environment:
      name: ci-unsigned
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use GNU tar on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitUsrBin = Join-Path $env:ProgramFiles 'Git\usr\bin'
          $gnuTar = Join-Path $gitUsrBin 'tar.exe'

          if (-not (Test-Path $gnuTar)) {
            throw "GNU tar not found at $gnuTar"
          }

          & $gnuTar --version
          Add-Content -Path $env:GITHUB_PATH -Value $gitUsrBin

      - name: Prepare cache directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force `
            -Path (Join-Path $env:GITHUB_WORKSPACE '.cache') | Out-Null

      - name: Use GNU tar on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install gnu-tar
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"
          tar --version

      - name: Restore cache artifact
        id: cache
        uses: Ludy87/cache-the-planet/multi-cache@103a69c7d774206009d93b1d701c7d31d9bd2b15
        with:
          cleanup-path-after-save: true
          version: 5
          encryption-key: ${{ secrets.CACHE_SFTP_PASSWORD || '' }}
          storage: github-artifact
          artifact-retention-days: 1
          manifest-branch: dev-cache-artifact
          manifest-path: .github/cache-data
          multi-cache: |
            gradle-caches:
              path: .cache/gradle-java-${{ inputs.java-version }}/caches
            gradle-wrapper:
              path: .cache/gradle-java-${{ inputs.java-version }}/wrapper
          save-scope: shared
          key: |
            gradle-caches=${{ inputs.gradle-hash }}
            gradle-wrapper=${{ inputs.gradle-hash }}
          token: ${{ github.token }}
          allow-shared-restore: true
          strict: false

      - name: Set up JDK 25
        uses: ./.github/actions/java
        with:
          java-version: "25"

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - name: Check licenses for compatibility
        run: task backend:licenses:check
        env:
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_PUBLIC_URL: ${{ secrets.MAVEN_PUBLIC_URL }}

      - name: FAILED - check the licenses for compatibility
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependencies-without-allowed-license.json
          path: build/reports/dependency-license/dependencies-without-allowed-license.json
          retention-days: 3
