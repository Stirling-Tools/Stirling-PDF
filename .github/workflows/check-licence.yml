name: License compatibility check

# Reusable workflow called from build.yml when build.gradle / module gradle
# files change. Verifies all transitive dependencies use a permitted license.
on:
  workflow_call:
    inputs:
      gradle-hash:
        required: true
        type: string
      java-version:
        required: false
        default: "25"
        type: string

permissions:
  contents: read

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.cache/gradle-java-${{ inputs.java-version }}

jobs:
  check-licence:
    permissions:
      contents: write
    environment:
      name: ci-unsigned
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout trusted Java action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted-java-action
          sparse-checkout: .github/actions/java
          persist-credentials: false

      - name: Restore cache artifact
        id: cache
        uses: ./.github/actions/cache-the-planet
        with:
          encryption-key: ${{ secrets.CACHE_SFTP_PASSWORD || '' }}
          token: ${{ github.token }}
          multi-cache: |
            licence-gradle-caches:
              path: .cache/gradle-java-${{ inputs.java-version }}/caches
            licence-gradle-wrapper:
              path: .cache/gradle-java-${{ inputs.java-version }}/wrapper
          key: |
            licence-gradle-caches=${{ inputs.gradle-hash }}
            licence-gradle-wrapper=${{ inputs.gradle-hash }}

      - name: Set up JDK 25
        uses: ./trusted-java-action/.github/actions/java
        with:
          java-version: "25"

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Check licenses for compatibility
        run: task backend:licenses:check
        env:
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_PUBLIC_URL: ${{ secrets.MAVEN_PUBLIC_URL }}

      - name: FAILED - check the licenses for compatibility
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependencies-without-allowed-license.json
          path: build/reports/dependency-license/dependencies-without-allowed-license.json
          retention-days: 3
