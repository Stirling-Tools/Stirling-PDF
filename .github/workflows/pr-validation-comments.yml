name: PR validation comments

# Runs from the default branch after validation completes. It never checks
# out or executes code from the pull request.
on:
  workflow_run:
    workflows: ['Build and Test Workflow']
    types: [completed]

jobs:
  frontend:
    if: github.event.workflow_run.event == 'pull_request'
    permissions:
      contents: read
      issues: write
      pull-requests: read
    name: Frontend validation comment
    runs-on: ubuntu-latest
    env:
      CHECK_JOB: "frontend-validation"
      CHECK_STEP: "Quality-check frontend"
      COMMENT_MARKER: "<!-- frontend-check -->"
      COMMENT_BODY: |
        <!-- frontend-check -->
        ### Frontend Check Failed
        
        There are issues with your frontend code that will need to be fixed before they can be merged in.
        
        Run `task frontend:fix` to auto-fix what can be fixed automatically, then run `task frontend:check:all` to see what still needs fixing manually.
    steps:
      - name: Update frontend comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            });
            const matchingJobs = jobs.filter(job => job.name.includes(process.env.CHECK_JOB));
            if (matchingJobs.length === 0) return;
            const matchingSteps = process.env.CHECK_STEP
              ? matchingJobs.flatMap(job => (job.steps ?? [])
                .filter(step => step.name === process.env.CHECK_STEP))
              : matchingJobs;
            if (matchingSteps.length === 0) return;
            
            const pullRequest = run.pull_requests?.[0];
            if (!pullRequest) return;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
            });
            const existing = comments.find(comment => comment.body?.includes(process.env.COMMENT_MARKER));
            const failed = matchingSteps.some(step => step.conclusion === 'failure');
            
            if (failed && !existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                body: process.env.COMMENT_BODY,
              });
            } else if (failed && existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: process.env.COMMENT_BODY,
              });
            } else if (!failed && existing) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
              });
            }
