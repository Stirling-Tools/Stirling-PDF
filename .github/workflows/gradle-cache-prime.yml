name: Prime Gradle Cache

on:
  workflow_call:
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  VERSION: 1
  JAVA_VERSION: 25
  FILES_TO_HASH: |
    gradle/wrapper/gradle-wrapper.properties
    gradle/libs.versions.toml
    buildSrc/**
    settings.gradle
    build.gradle
    app/**/build.gradle
    gradle/**/*.gradle

jobs:
  hash_pr:
    name: Hash Gradle files
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      java_version: ${{ steps.hash.outputs.java_version }}
      files_hash: ${{ steps.hash.outputs.files_hash}}
      cache_key: ${{ steps.hash.outputs.cache_key }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Hash Gradle files
        id: hash
        env:
          FILES_HASH: ${{ hashFiles(env.FILES_TO_HASH) }}
        run: |
          HASH="$FILES_HASH"
          echo "java_version=${{ env.JAVA_VERSION }}" >> "$GITHUB_OUTPUT"
          echo "files_hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "cache_key=gradle-v1-${{ runner.os }}-${{ runner.arch }}-jdk-${{ env.JAVA_VERSION }}-$HASH" >> "$GITHUB_OUTPUT"

  gradle-cache-prime:
    environment:
      name: ci-unsigned
      deployment: false
    name: Prime shared Gradle cache - ${{ matrix.platform }}
    needs: hash_pr
    strategy:
      fail-fast: true
      matrix:
        platform: [windows-latest, windows-11-arm, macos-15, ubuntu-22.04, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.cache/gradle-java-${{ needs.hash_pr.outputs.java_version }}
      CACHE_COMPRESSION_LEVEL: 1
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Restore Gradle cache sftp
        id: cache
        uses: Ludy87/cache-the-planet/multi-cache@8603ad79afba9b644ea7dd095f57c36103147ea6
        with:
          manifest-branch: dev-cache
          manifest-path: .github/cache-data
          storage: sftp
          sftp-host: ${{ secrets.CACHE_SFTP_HOST }}
          sftp-port: ${{ secrets.CACHE_SFTP_PORT || '22' }}
          sftp-username: ${{ secrets.CACHE_SFTP_USERNAME }}
          sftp-password: ${{ secrets.CACHE_SFTP_PASSWORD }}
          sftp-base-path: ${{ secrets.CACHE_SFTP_BASE_PATH || '/files/cache-the-planet' }}
          multi-cache: |
            gradle-caches:
              path: .cache/gradle-java-${{ needs.hash_pr.outputs.java_version }}/caches
            gradle-wrapper:
              path: .cache/gradle-java-${{ needs.hash_pr.outputs.java_version }}/wrapper
          save-scope: shared
          token: ${{ github.token }}
          key: |
            gradle-caches=${{ needs.hash_pr.outputs.files_hash }}
            gradle-wrapper=${{ needs.hash_pr.outputs.files_hash  }}
          allow-shared-restore: true
          strict: false

      - name: Display cache information
        env:
          CACHE_IS_FORK: ${{ steps.cache.outputs.is-fork }}
          CACHE_READ_ONLY: ${{ steps.cache.outputs.read-only }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          CACHE_ERROR: ${{ steps.cache.outputs.error }}
        shell: bash
        run: |
          echo "Fork: $CACHE_IS_FORK"
          echo "Read-only: $CACHE_READ_ONLY"
          echo "Cache Hit: $CACHE_HIT"
          echo "Cache Error: $CACHE_ERROR"

      - name: Cache Gradle (lookup-only)
        id: cache-gradle-restore
        if: ${{ steps.cache.outputs.error }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/gradle-java-${{ needs.hash_pr.outputs.java_version }}/caches
            .cache/gradle-java-${{ needs.hash_pr.outputs.java_version }}/wrapper
          key: ${{ needs.hash_pr.outputs.cache_key }}
          lookup-only: true

      - name: Set up JDK ${{ needs.hash_pr.outputs.java_version }}
        # if: ${{ steps.cache-gradle-restore.outputs.cache-hit != 'true' && steps.cache.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/java
        with:
          java-version: ${{ needs.hash_pr.outputs.java_version }}

      - name: Resolve backend dependencies
        if: ${{ steps.cache-gradle-restore.outputs.cache-hit != 'true' && steps.cache.outputs.cache-hit != 'true' }}
        run: ./gradlew :stirling-pdf:classes --no-daemon
        env:
          STIRLING_FLAVOR: saas
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_PUBLIC_URL: ${{ secrets.MAVEN_PUBLIC_URL }}

      - name: Save cache Gradle User Home
        if: ${{ steps.cache-gradle-restore.outputs.cache-hit != 'true' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/gradle-java-${{ needs.hash_pr.outputs.java_version }}/caches
            .cache/gradle-java-${{ needs.hash_pr.outputs.java_version }}/wrapper
          key: ${{ needs.hash_pr.outputs.cache_key }}
