name: Prime Gradle Cache

on:
  workflow_call:
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  JAVA_VERSION: 25
  FILES_TO_HASH: |
    gradle/wrapper/gradle-wrapper.properties
    gradle/libs.versions.toml
    buildSrc/**
    settings.gradle
    build.gradle
    app/**/build.gradle
    gradle/**/*.gradle

jobs:
  gradle-cache-prime:
    environment:
      name: ci-unsigned
      deployment: false
    name: Prime shared Gradle cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.cache/gradle-java-${{ env.JAVA_VERSION }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Hash Gradle files
        id: hash
        env:
          FILES_HASH: ${{ hashFiles(env.FILES_TO_HASH) }}
        shell: bash
        run: |
          HASH="$FILES_HASH"
          echo "java_version=${{ env.JAVA_VERSION }}" >> "$GITHUB_OUTPUT"
          echo "files_hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Use GNU tar on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitUsrBin = Join-Path $env:ProgramFiles 'Git\usr\bin'
          $gnuTar = Join-Path $gitUsrBin 'tar.exe'

          if (-not (Test-Path $gnuTar)) {
            throw "GNU tar not found at $gnuTar"
          }

          & $gnuTar --version
          Add-Content -Path $env:GITHUB_PATH -Value $gitUsrBin

      - name: Use GNU tar on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install gnu-tar
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"
          tar --version

      - name: Restore Gradle cache github-artifact
        id: cache
        uses: Ludy87/cache-the-planet/multi-cache@ea6aa04213fec4fdcfcf77f133ee93bf2176bd38
        with:
          manifest-branch: dev-cache-artifact
          manifest-path: .github/cache-data
          storage: github-artifact
          artifact-retention-days: 1
          disable-download: true
          multi-cache: |
            gradle-caches:
              path: .cache/gradle-java-${{ env.JAVA_VERSION }}/caches
            gradle-wrapper:
              path: .cache/gradle-java-${{ env.JAVA_VERSION }}/wrapper
          save-scope: shared
          token: ${{ github.token }}
          key: |
            gradle-caches=${{ steps.hash.outputs.files_hash }}
            gradle-wrapper=${{ steps.hash.outputs.files_hash  }}
          allow-shared-restore: true
          strict: false

      - name: Display cache information
        id: display
        env:
          CACHE_IS_FORK: ${{ steps.cache.outputs.is-fork }}
          CACHE_READ_ONLY: ${{ steps.cache.outputs.read-only }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          CACHE_ERROR: ${{ steps.cache.outputs.error }}
          CACHE_HIT_GRADLE_CACHE: ${{ fromJSON(steps.cache.outputs.cache-results)['gradle-caches']['cache-hit'] }}
          CACHE_HIT_GRADLE_WRAPPER: ${{ fromJSON(steps.cache.outputs.cache-results)['gradle-wrapper']['cache-hit'] }}
        shell: bash
        run: |
          echo "Fork: $CACHE_IS_FORK"
          echo "Read-only: $CACHE_READ_ONLY"
          echo "Cache Hit: $CACHE_HIT"
          echo "Cache Error: $CACHE_ERROR"
          echo "cache_hit_gradle_cache=$CACHE_HIT_GRADLE_CACHE" >> "$GITHUB_OUTPUT"
          echo "cache_hit_gradle_cache: $CACHE_HIT_GRADLE_CACHE"
          echo "cache_hit_gradle_wrapper=$CACHE_HIT_GRADLE_WRAPPER" >> "$GITHUB_OUTPUT"
          echo "cache_hit_gradle_wrapper: $CACHE_HIT_GRADLE_WRAPPER"
          echo '${{ toJSON(fromJSON(steps.cache.outputs.cache-results)) }}'

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        if: |
          steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/java
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Resolve backend dependencies
        if: |
          steps.cache.outputs.cache-hit != 'true'
        run: ./gradlew :stirling-pdf:classes --no-daemon
        env:
          STIRLING_FLAVOR: saas
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_PUBLIC_URL: ${{ secrets.MAVEN_PUBLIC_URL }}
