name: Prime Gradle Cache

on:
  workflow_call:
    inputs:
      gradle-hash:
        required: true
        type: string
      java-version:
        required: false
        default: "25"
        type: string
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.cache/gradle-java-${{ inputs.java-version }}

jobs:
  gradle-cache-prime:
    environment:
      name: ci-unsigned
      deployment: false
    name: Prime shared Gradle cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # - name: Checkout trusted cache action
      #   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      #   with:
      #     repository: ${{ github.repository }}
      #     ref: ${{ github.event.pull_request.base.sha || github.sha }}
      #     path: trusted-cache-action
      #     sparse-checkout: .github/actions/cache-the-planet
      #     persist-credentials: false

      - name: Checkout trusted Java action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted-java-action
          sparse-checkout: .github/actions/java
          persist-credentials: false

      - name: Restore Gradle cache github-artifact
        id: cache
        # uses: ./trusted-cache-action/.github/actions/cache-the-planet
        uses: ./.github/actions/cache-the-planet
        with:
          encryption-key: ${{ secrets.CACHE_SFTP_PASSWORD || '' }}
          token: ${{ github.token }}
          disable-download: true
          multi-cache: |
            gradle-caches:
              path: .cache/gradle-java-${{ inputs.java-version }}/caches
            gradle-wrapper:
              path: .cache/gradle-java-${{ inputs.java-version }}/wrapper
          key: |
            gradle-caches=${{ inputs.gradle-hash }}
            gradle-wrapper=${{ inputs.gradle-hash }}

      - name: Display cache information
        id: display
        env:
          CACHE_IS_FORK: ${{ steps.cache.outputs.is-fork }}
          CACHE_READ_ONLY: ${{ steps.cache.outputs.read-only }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          CACHE_ERROR: ${{ steps.cache.outputs.error }}
          CACHE_HIT_GRADLE_CACHE: ${{ fromJSON(steps.cache.outputs.cache-results || '{"gradle-caches":{"cache-hit":false}}')['gradle-caches']['cache-hit'] }}
          CACHE_HIT_GRADLE_WRAPPER: ${{ fromJSON(steps.cache.outputs.cache-results || '{"gradle-wrapper":{"cache-hit":false}}')['gradle-wrapper']['cache-hit'] }}
        shell: bash
        run: |
          echo "Fork: $CACHE_IS_FORK"
          echo "Read-only: $CACHE_READ_ONLY"
          echo "Cache Hit: $CACHE_HIT"
          echo "Cache Error: $CACHE_ERROR"
          echo "cache_hit_gradle_cache=$CACHE_HIT_GRADLE_CACHE" >> "$GITHUB_OUTPUT"
          echo "cache_hit_gradle_cache: $CACHE_HIT_GRADLE_CACHE"
          echo "cache_hit_gradle_wrapper=$CACHE_HIT_GRADLE_WRAPPER" >> "$GITHUB_OUTPUT"
          echo "cache_hit_gradle_wrapper: $CACHE_HIT_GRADLE_WRAPPER"
          echo '${{ toJSON(fromJSON(steps.cache.outputs.cache-results || '{}')) }}'

      - name: Set up JDK ${{ inputs.java-version }}
        if: |
          steps.cache.outputs.cache-hit != 'true'
        uses: ./trusted-java-action/.github/actions/java
        with:
          java-version: ${{ inputs.java-version }}

      - name: Resolve backend dependencies
        if: |
          steps.cache.outputs.cache-hit != 'true'
        run: ./gradlew :stirling-pdf:classes --no-daemon -x spotlessApply
        env:
          STIRLING_FLAVOR: saas
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_PUBLIC_URL: ${{ secrets.MAVEN_PUBLIC_URL }}
