name: Prime Gradle Cache

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  uv-cache-prime:
    environment:
      name: ci-unsigned
      deployment: false
    name: Prime uv cache
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        # if: steps.cache-uv-restore.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          enable-cache: true
          download-from-astral-mirror: false

  unoserver-image-cache-prime:
    if: false
    environment:
      name: ci-unsigned
      deployment: false
    name: Prime unoserver image cache
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cache buildx (lookup-only)
        id: cache-buildx-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/.buildx-cache
          key: test-build-unoserver-image-${{ runner.os }}-${{ hashFiles(
            'docker/unoserver/Dockerfile',
            'docker/unoserver/fonts.conf',
            'docker/unoserver/entrypoint.sh',
            'docker/unoserver/healthcheck.sh',
            '.dockerignore'
            ) }}
          lookup-only: true

      - name: Set up QEMU
        if: steps.cache-buildx-restore.outputs.cache-hit != 'true'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        if: steps.cache-buildx-restore.outputs.cache-hit != 'true'
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build docker/unoserver/Dockerfile
        if: steps.cache-buildx-restore.outputs.cache-hit != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./docker/unoserver/Dockerfile
          push: false
          load: true
          cache-from: |
            type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: |
            type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max
          platforms: linux/amd64
          tags: stirling-unoserver:pr-test
          provenance: false
          sbom: false

      - # Temp fix
        # https://github.com/docker/build-push-action/issues/252
        # https://github.com/moby/buildkit/issues/1896
        if: steps.cache-buildx-restore.outputs.cache-hit != 'true'
        name: Move cache
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache-new ${{ runner.temp }}/.buildx-cache

      - name: Save cache buildx
        if: steps.cache-buildx-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/.buildx-cache
          key: test-build-unoserver-image-${{ runner.os }}-${{ hashFiles(
            'docker/unoserver/Dockerfile',
            'docker/unoserver/fonts.conf',
            'docker/unoserver/entrypoint.sh',
            'docker/unoserver/healthcheck.sh',
            '.dockerignore'
            ) }}

  gradle-cache-prime:
    if: false
    environment:
      name: ci-unsigned
      deployment: false
    name: Prime shared Gradle cache
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Calculate Gradle cache key
        id: gradle-cache-key
        shell: bash
        run: |
          echo "key=gradle-v1-${{ runner.os }}-${{ runner.arch }}-jdk-25-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'buildSrc/**', 'settings.gradle', 'build.gradle', 'app/**/build.gradle', 'gradle/**/*.gradle') }}" >> "$GITHUB_OUTPUT"

      - name: Cache Gradle (lookup-only)
        id: cache-gradle-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache-key.outputs.key }}
          lookup-only: true

      - name: Set up JDK 25
        if: steps.cache-gradle-restore.outputs.cache-hit != 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Resolve backend dependencies
        if: steps.cache-gradle-restore.outputs.cache-hit != 'true'
        run: ./gradlew :stirling-pdf:classes --no-daemon
        env:
          STIRLING_FLAVOR: saas
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_PUBLIC_URL: ${{ secrets.MAVEN_PUBLIC_URL }}

      - name: Save cache Gradle User Home
        if: steps.cache-gradle-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache-key.outputs.key }}
