name: Prime Gradle Cache

on:
  workflow_call:
  push:
    branches: ["dev-cache"]

permissions:
  contents: read

env:
  VERSION: 1
  JAVA_VERSION: 25
  FILES_TO_HASH: |
    gradle/wrapper/gradle-wrapper.properties
    gradle/libs.versions.toml
    buildSrc/**
    settings.gradle
    build.gradle
    app/**/build.gradle
    gradle/**/*.gradle

jobs:
  hash_pr:
    name: Hash Gradle files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      files_hash: ${{ steps.hash.outputs.files_hash }}
      java_version: ${{ steps.hash.outputs.java_version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Hash Gradle files
        id: hash
        env:
          FILES_HASH: ${{ hashFiles(env.FILES_TO_HASH) }}
        run: |
          HASH="$FILES_HASH"
          echo "files_hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "java_version=${{ env.JAVA_VERSION }}" >> "$GITHUB_OUTPUT"
  gradle-cache-prime:
    environment:
      name: ci-unsigned
      deployment: false
    name: Prime shared Gradle cache
    needs: hash_pr
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.cache/gradle-java${{ needs.hash_pr.outputs.java_version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup GitHub App Bot
        if: (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)) && github.actor != 'dependabot[bot]'
        id: setup-bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
        continue-on-error: true

      - name: Restore Gradle cache asset
        id: cache
        uses: Ludy87/cache-the-planet@v1.8
        with:
          cache-name: "gradle-java${{ env.JAVA_VERSION }}"
          save-scope: shared
          token: ${{ steps.setup-bot.outputs.token || github.token }}
          storage: sftp
          sftp-host: ${{ secrets.CACHE_SFTP_HOST }}
          sftp-port: ${{ secrets.CACHE_SFTP_PORT || '22' }}
          sftp-username: ${{ secrets.CACHE_SFTP_USERNAME }}
          sftp-password: ${{ secrets.CACHE_SFTP_PASSWORD }}
          sftp-base-path: ${{ secrets.CACHE_SFTP_BASE_PATH || '/files/cache-the-planet' }}
          key: ${{ needs.hash_pr.outputs.files_hash }}
          allow-shared-restore: true
          path: |
            .cache/gradle-java${{ env.JAVA_VERSION }}/caches
            .cache/gradle-java${{ env.JAVA_VERSION }}/wrapper
          strict: true

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: ./.github/actions/java
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Resolve backend dependencies
        run: ./gradlew :stirling-pdf:classes --no-daemon
        env:
          STIRLING_FLAVOR: saas
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_PUBLIC_URL: ${{ secrets.MAVEN_PUBLIC_URL }}

      - name: Display cache information
        env:
          CACHE_IS_FORK: ${{ steps.cache.outputs.is-fork }}
          CACHE_READ_ONLY: ${{ steps.cache.outputs.read-only }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        shell: bash
        run: |
          echo "Fork: $CACHE_IS_FORK"
          echo "Read-only: $CACHE_READ_ONLY"
          echo "Cache Hit: $CACHE_HIT"

      - name: Upload Gradle cache artifact for trusted publisher
        if: ${{ steps.cache.outputs.cache-hit == 'false' && github.event_name == 'pull_request' && success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cache-the-planet-pr-${{ github.event.pull_request.number }}-gradle-java${{ env.JAVA_VERSION }}-${{ needs.hash_pr.outputs.files_hash }}-v${{ env.VERSION }}
          path: |
            .cache/gradle-java${{ env.JAVA_VERSION }}/caches
            .cache/gradle-java${{ env.JAVA_VERSION }}/wrapper
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 1
