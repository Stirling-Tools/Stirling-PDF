name: Nightly E2E Tests

on:
  schedule:
    - cron: "0 2 * * *" # 2 AM UTC every night
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright-all-browsers:
    name: Playwright (chromium + firefox + webkit)
    runs-on: ubuntu-latest
    env:
      BORINGCACHE_ENABLED: ${{ vars.BORINGCACHE_ENABLED == 'true' && (secrets.BORINGCACHE_RESTORE_TOKEN != '' || (github.event_name != 'pull_request' && secrets.BORINGCACHE_SAVE_TOKEN != '')) && 'true' || 'false' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Restore npm dependencies with BoringCache
        if: env.BORINGCACHE_ENABLED == 'true'
        uses: boringcache/one@71fdb67f0aa0afc1c4ac616c8c57d0d535f15bd9 # v1.19.2
        with:
          trust-policy: auto
          setup: none
          mode: archive
          cache-profiles: npm-dependencies
          metadata-hints: workflow=nightly,job=playwright-all-browsers
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ github.event_name != 'pull_request' && secrets.BORINGCACHE_SAVE_TOKEN || '' }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: ${{ env.BORINGCACHE_ENABLED != 'true' && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json

      - name: Install Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
      - name: Install all Playwright browsers
        run: task e2e:install

      - name: Build frontend (production bundle for vite preview)
        env:
          VITE_BUILD_FOR_PREVIEW: "1"
        run: task frontend:build

      - name: Run E2E tests (all browsers)
        run: task e2e:cross-browser

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-nightly-${{ github.run_id }}
          path: frontend/playwright-report/
          retention-days: 14

  # Whole-suite accessibility sweep. Pull requests only scan the stories they
  # touch (frontend-a11y.yml) because a full pass takes ~30 minutes; this covers
  # everything else, so a violation introduced by a change somewhere other than
  # the story itself — a shared component, a theme token — still surfaces within
  # a day.
  a11y-all-stories:
    name: a11y (every story, light + dark)
    runs-on: ubuntu-latest
    # Two full sweeps (one per theme), each ~30 minutes of browser time.
    timeout-minutes: 120
    env:
      BORINGCACHE_ENABLED: ${{ vars.BORINGCACHE_ENABLED == 'true' && (secrets.BORINGCACHE_RESTORE_TOKEN != '' || (github.event_name != 'pull_request' && secrets.BORINGCACHE_SAVE_TOKEN != '')) && 'true' || 'false' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Restore npm dependencies with BoringCache
        if: env.BORINGCACHE_ENABLED == 'true'
        uses: boringcache/one@71fdb67f0aa0afc1c4ac616c8c57d0d535f15bd9 # v1.19.2
        with:
          trust-policy: auto
          setup: none
          mode: archive
          cache-profiles: npm-dependencies
          metadata-hints: workflow=nightly,job=a11y-all-stories
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ github.event_name != 'pull_request' && secrets.BORINGCACHE_SAVE_TOKEN || '' }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: ${{ env.BORINGCACHE_ENABLED != 'true' && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json

      - name: Install Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0

      - name: a11y gate (every story, light + dark)
        run: task frontend:storybook:a11y

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a11y-scan-nightly-${{ github.run_id }}
          path: frontend/.a11y-scan/
          retention-days: 14
          if-no-files-found: ignore
          # The reports live in a dot-directory, which upload-artifact treats as
          # hidden and silently skips by default.
          include-hidden-files: true

  # Builds all desktop platforms on a schedule so the Rust dependency cache is
  # written on main, where PR and merge-queue tauri builds can restore it.
  warm-tauri-cache:
    name: Warm Tauri Rust cache
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/tauri-build.yml
    with:
      platform: all
      sign: false
    secrets: inherit
