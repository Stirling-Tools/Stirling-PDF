name: PSS CI

on:
  push:
    branches: [pss/main]
  pull_request:
    branches: [pss/main]

permissions:
  contents: read

jobs:
  license-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/pss-license-guard.sh

  frontend:
    needs: license-guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      STIRLING_FLAVOR: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit --project src/editor/core/tsconfig.json
      - run: npx vite build --mode core

  backend:
    needs: license-guard
    runs-on: ubuntu-latest
    env:
      STIRLING_FLAVOR: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :stirling-pdf:compileJava :common:compileJava --no-daemon
