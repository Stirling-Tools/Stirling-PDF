name: deploypr cache benchmark

# Temporary: times the /deploypr image build with and without the GHA layer cache.
on:
  push:
    branches: [ci/deploypr-cache-benchmark]

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [nocache, read, readwrite]
        attempt: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/embedded/Dockerfile
          push: false
          no-cache: ${{ matrix.mode == 'nocache' }}
          cache-from: ${{ matrix.mode != 'nocache' && 'type=gha,scope=stirling-pdf-latest' || '' }}
          cache-to: ${{ matrix.mode == 'readwrite' && format('type=gha,mode=max,scope=deploypr-bench-{0},ignore-error=true', matrix.attempt) || '' }}
          build-args: |
            VERSION_TAG=alpha
          platforms: linux/amd64

  host-gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-deploy-pr-v1-${{ runner.os }}-${{ runner.arch }}-jdk-25-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'buildSrc/**', 'settings.gradle', 'build.gradle', 'app/**/build.gradle', 'gradle/**/*.gradle') }}

      - uses: ./.github/actions/java
        with:
          java-version: "25"

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: task backend:build (as deploy-pr runs it)
        run: task backend:build
        env:
          DISABLE_ADDITIONAL_FEATURES: "true"
          STIRLING_PDF_DESKTOP_UI: false
