name: PR turn labels

# Adds waiting-on-author on a changes-requested review and removes it when the PR
# author responds. The rules live in .github/scripts/pr-turn.ts. Reviews arrive
# through pr-review-events.yml. Off unless STALE_PR_BOT_LIVE is "true".

on:
  workflow_run:
    workflows: ["PR review events"]
    types: [completed]
  pull_request_target:
    types: [synchronize, ready_for_review, review_requested]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  update:
    name: Update the turn label
    # Only the author moves the turn on a push, ready, re-request or comment.
    if: >-
      vars.STALE_PR_BOT_LIVE == 'true' && vars.CI_PROFILE != 'lite' && (
        github.event_name == 'workflow_run' ||
        (github.event.pull_request && github.event.sender.login == github.event.pull_request.user.login) ||
        (github.event.issue.pull_request && github.event.comment.user.login == github.event.issue.user.login)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read # actions/checkout
      issues: write # add/remove labels
      pull-requests: write # add/remove labels on PRs
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Update the turn label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const { updateTurnLabel } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-turn.ts`);
            await updateTurnLabel({ github, context, core });
