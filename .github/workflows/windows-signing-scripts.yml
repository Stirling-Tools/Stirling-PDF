name: Windows signing scripts

on:
  pull_request:
    paths:
      - ".github/scripts/sign-windows-*.ps1"
      - ".github/scripts/test-sign-windows-scripts.ps1"
      - ".github/workflows/windows-signing-scripts.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test signing scripts with a throwaway certificate
        shell: pwsh
        run: ./.github/scripts/test-sign-windows-scripts.ps1
