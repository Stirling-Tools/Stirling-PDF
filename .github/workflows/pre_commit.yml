name: Pre-commit

# Runs the repo-wide lint/format/secret checks via `task pre-commit`.
# Called from build.yml on PRs and merge_group; also runnable on demand via workflow_dispatch.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/setup-uv-cache
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.cache/uv-python-dir
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.cache/npm
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Blobs load lazily; full-history fetch otherwise pulls every branch's files.
          filter: blob:none
          persist-credentials: false

      - name: Restore uv cache
        id: cache
        uses: ./.github/actions/cache-the-planet
        with:
          encryption-key: ${{ secrets.CACHE_SFTP_PASSWORD || '' }}
          token: ${{ github.token }}
          multi-cache: |
            pre-commit-setup-uv-cache:
              path: .cache/setup-uv-cache
            pre-commit-uv-python-dir:
              path: .cache/uv-python-dir
            pre-commit-npm-cache:
              path: .cache/npm
          key: |
            pre-commit-setup-uv-cache=${{ hashFiles('engine/.python-version', 'engine/pyproject.toml', 'engine/uv.lock') }}
            pre-commit-uv-python-dir=${{ hashFiles('engine/.python-version', 'engine/pyproject.toml', 'engine/uv.lock') }}
            pre-commit-npm-cache=${{ hashFiles('frontend/package-lock.json') }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
          cache-dependency-glob: |
            engine/pyproject.toml
            engine/uv.lock
          cache-local-path: .cache/setup-uv-cache

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          # Pinned: resolving "3.x" calls the GitHub releases API, which flakes
          # and fails this gate before the checks even start.
          version: 3.54.0

      - name: Run pre-commit checks
        run: task pre-commit

      # The fixture corpus checks the comment rules themselves, so it runs here
      # rather than on every local commit.
      - name: Check the comment-lint fixture corpus
        run: task pre-commit:comment-lint:selftest
