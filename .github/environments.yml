###############################################################################
# Declarative source of truth for this repo's GitHub Actions environments.
#
# Only the `secrets:` lists are applied automatically, by
# .github/workflows/sync-environments.yml, and only additively: it creates an
# environment if absent and sets a secret only when that environment has none by
# that name. It never overwrites a secret and never deletes anything.
#
# `branches:` and `reviewers:` are DOCUMENTATION of the intended protection rules.
# Nothing applies them - set them by hand in Settings > Environments. They are
# recorded here so the intent is reviewable alongside the secrets.
#
# Rules:
#   branches: all         -> no deployment branch policy (any ref, incl. PR and
#                            merge-queue refs). Required for anything a PR runs.
#             [a, b, ...] -> custom policy. Prefix a tag pattern with "tag:".
#   reviewers:            -> GitHub logins that must approve. Empty = no pause.
#   secrets:              -> names to fill in. One already present in the
#                            environment is left untouched; one that exists in
#                            neither the environment nor repo/org scope fails the run.
#
# Never add SCORECARD_TOKEN or ENV_BOOTSTRAP_TOKEN here: they are consumed by jobs
# that cannot declare an environment (scorecards.yml, and the sync job itself),
# so they must stay repo-scoped. Listing ENV_BOOTSTRAP_TOKEN would copy an admin
# PAT into every environment.
#
# Referenced by workflows but deliberately absent, because they exist in no store
# (not repo, not org, not any environment) and would fail every run:
#   MAVEN_PUBLIC_URL   - empty today, so build.gradle:80 falls back to Maven Central
#                        and MAVEN_USER/MAVEN_PASSWORD are never actually used.
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD - the updater key has no passphrase; updater
#                        signature verification passes with it empty.
#
# Environments NOT listed here (saas-dev, prod, copilot) are left untouched. They
# hold credentials no workflow in this repo reads - audit them separately.
#
# pr-preview still holds NEW_VPS_IP, which has no consumer left. Nothing here
# removes it - delete it by hand if you want it gone.
###############################################################################

environments:
  # ---------------------------------------------------------------- CI (open)
  # Reachable from every ref, including pull_request and merge_group. Must stay
  # unprotected: PR refs satisfy no branch policy, so adding one breaks every PR.
  ci-unsigned:
    branches: all
    reviewers: []
    secrets:
      - MAVEN_USER
      - MAVEN_PASSWORD
      - PREMIUM_KEY_ENTERPRISE
      - DEPOT_TOKEN

  # Holds a GitHub App key that mints a repo-write token. Separate from
  # ci-unsigned so ordinary build jobs cannot read it.
  ci-bot:
    branches: all
    reviewers: []
    secrets:
      - GH_APP_ID
      - GH_APP_PRIVATE_KEY
      - MAVEN_USER
      - MAVEN_PASSWORD

  # macOS-only signing for PR/nightly Tauri builds. Deliberately excludes SM_*,
  # WINDOWS_CERTIFICATE* and RELEASE_GPG_*: those steps are gated on the release
  # branch and run under release-signing instead.
  ci-signing:
    branches: all
    reviewers: []
    secrets:
      - APPLE_CERTIFICATE
      - APPLE_CERTIFICATE_PASSWORD
      - APPLE_ID
      - APPLE_ID_PASSWORD
      - APPLE_TEAM_ID
      - TAURI_SIGNING_PRIVATE_KEY
      - VITE_SAAS_SERVER_URL
      - VITE_SAAS_BACKEND_API_URL
      - VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY
      - MAVEN_USER
      - MAVEN_PASSWORD

  pr-preview:
    branches: all
    reviewers: []
    secrets:
      - ANTHROPIC_API_KEY
      - ENTERPRISE_KEY
      - PREMIUM_KEY
      - NEW_VPS_HOST
      - NEW_VPS_SSH_KEY
      - NEW_VPS_USERNAME
      - TEST_LOGIN_USERNAME
      - TEST_LOGIN_PASSWORD
      - MAVEN_USER
      - MAVEN_PASSWORD

  # ------------------------------------------------------------- CI (branch-locked)
  bot-identity:
    branches:
      - main
    reviewers: []
    secrets:
      - GH_APP_ID
      - GH_APP_PRIVATE_KEY

  # Publishes stirlingtools/stirling-pdf-base, which every shipped image FROMs,
  # and cosign-signs it with the same key docker-publish uses. Highest-value
  # environment in the repo.
  #
  # No branch policy is workable - it is dispatched from whatever branch carries
  # the Dockerfile change (main, security/server-image-cves, ...). So the gate is
  # required reviewers instead. push-docker-base.yml's github.actor guard is NOT
  # sufficient on its own: that check lives in the workflow file at the dispatched
  # ref, so anyone with write access could push a branch with it removed. An
  # environment reviewer is enforced by GitHub and cannot be edited away.
  #
  # It has run 3 times in 5 months, so an approval pause costs nothing.
  docker-base-publish:
    branches: all
    reviewers:
      - Frooodle
      - jbrunton96
    secrets:
      - DOCKER_HUB_USERNAME
      - DOCKER_HUB_ORG_USERNAME
      - DOCKER_HUB_API
      - COSIGN_PRIVATE_KEY
      - COSIGN_PASSWORD

  docker-publish:
    branches:
      - release
      - main
    reviewers: []
    secrets:
      - DOCKER_HUB_USERNAME
      - DOCKER_HUB_ORG_USERNAME
      - DOCKER_HUB_API
      - COSIGN_PRIVATE_KEY
      - COSIGN_PASSWORD
      - MAVEN_USER
      - MAVEN_PASSWORD

  # ----------------------------------------------------------- Release (gated)
  package-publish:
    branches:
      - main
      - release
      - "tag:v*"
    reviewers:
      - Frooodle
      - jbrunton96
    secrets:
      - AUR_SSH_PRIVATE_KEY
      - HOMEBREW_TAP_TOKEN
      - SWAGGERHUB_API_KEY
      - MAVEN_USER
      - MAVEN_PASSWORD

  # hotfix/* is required: every desktop build since 2026-07 was a workflow_dispatch
  # from a hotfix branch, and the existing [main, tag:v*] policy already refuses them.
  release-signing:
    branches:
      - main
      - release
      - "hotfix/*"
      - "tag:v*"
    reviewers:
      - Frooodle
      - jbrunton96
    secrets:
      - APPLE_CERTIFICATE
      - APPLE_CERTIFICATE_PASSWORD
      - APPLE_ID
      - APPLE_ID_PASSWORD
      - APPLE_TEAM_ID
      # WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD are deliberately absent.
      # Their only consumer is the legacy PFX import, gated on `env.SM_API_KEY == ''`
      # - dead while DigiCert KeyLocker is configured, and neither secret exists.
      - SM_API_KEY
      - SM_CLIENT_CERT_FILE_B64
      - SM_CLIENT_CERT_PASSWORD
      - SM_CODE_SIGNING_CERT_SHA1_HASH
      - SM_HOST
      - SM_KEYPAIR_ALIAS
      - RELEASE_GPG_PRIVATE_KEY
      - RELEASE_GPG_PASSPHRASE
      - TAURI_SIGNING_PRIVATE_KEY
      - VITE_SAAS_SERVER_URL
      - VITE_SAAS_BACKEND_API_URL
      - VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY
      - MAVEN_USER
      - MAVEN_PASSWORD
