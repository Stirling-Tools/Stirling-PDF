###############################################################################
# Declarative source of truth for this repo's GitHub Actions environments.
#
# Reconciled by .github/workflows/sync-environments.yml, which creates each
# environment, overwrites its protection rules to match this file, and copies
# the listed secrets in from repo/org scope.
#
# Rules:
#   branches: all         -> no deployment branch policy (any ref, incl. PR and
#                            merge-queue refs). Required for anything a PR runs.
#             protected   -> protected branches only.
#             [a, b, ...] -> custom policy. Prefix a tag pattern with "tag:".
#   reviewers:            -> GitHub logins that must approve. Empty = no pause.
#   prevent_self_review:  -> optional; defaults to true whenever reviewers are set.
#   wait_timer:           -> optional minutes to delay; defaults to 0.
#   secrets:              -> the environment's desired contents. A name already
#                            present in the environment but not available at
#                            repo/org scope is left alone; a name that exists in
#                            neither is reported and fails the run.
#
# The PUT that applies this file REPLACES an environment's whole protection-rule
# set, so anything not expressed here is cleared. Keep it complete.
#
# Never add SCORECARD_TOKEN or ENV_BOOTSTRAP_TOKEN here: they are consumed by jobs
# that cannot declare an environment (scorecards.yml, and the sync job itself),
# so they must stay repo-scoped. Listing ENV_BOOTSTRAP_TOKEN would copy an admin
# PAT into every environment.
#
# Referenced by workflows but deliberately absent, because they exist in no store
# (not repo, not org, not any environment) and would fail every run:
#   MAVEN_PUBLIC_URL   - empty today, so build.gradle:80 falls back to Maven Central
#                        and MAVEN_USER/MAVEN_PASSWORD are never actually used.
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD - the updater key has no passphrase; updater
#                        signature verification passes with it empty.
#
# Environments NOT listed here (saas-dev, prod, copilot) are left untouched. They
# hold credentials no workflow in this repo reads - audit them separately.
#
# prune_secrets deletes anything not listed. pr-preview still holds NEW_VPS_IP,
# which has no consumer left; pruning removes it for good.
###############################################################################

environments:
  # ---------------------------------------------------------------- CI (open)
  # Reachable from every ref, including pull_request and merge_group. Must stay
  # unprotected: PR refs satisfy no branch policy, so adding one breaks every PR.
  ci-unsigned:
    branches: all
    reviewers: []
    secrets:
      - MAVEN_USER
      - MAVEN_PASSWORD
      - PREMIUM_KEY_ENTERPRISE
      - DEPOT_TOKEN

  # Holds a GitHub App key that mints a repo-write token. Separate from
  # ci-unsigned so ordinary build jobs cannot read it.
  ci-bot:
    branches: all
    reviewers: []
    secrets:
      - GH_APP_ID
      - GH_APP_PRIVATE_KEY
      - MAVEN_USER
      - MAVEN_PASSWORD

  # macOS-only signing for PR/nightly Tauri builds. Deliberately excludes SM_*,
  # WINDOWS_CERTIFICATE* and RELEASE_GPG_*: those steps are gated on the release
  # branch and run under release-signing instead.
  ci-signing:
    branches: all
    reviewers: []
    secrets:
      - APPLE_CERTIFICATE
      - APPLE_CERTIFICATE_PASSWORD
      - APPLE_ID
      - APPLE_ID_PASSWORD
      - APPLE_TEAM_ID
      - TAURI_SIGNING_PRIVATE_KEY
      - VITE_SAAS_SERVER_URL
      - VITE_SAAS_BACKEND_API_URL
      - VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY
      - MAVEN_USER
      - MAVEN_PASSWORD

  pr-preview:
    branches: all
    reviewers: []
    secrets:
      - ANTHROPIC_API_KEY
      - ENTERPRISE_KEY
      - PREMIUM_KEY
      - NEW_VPS_HOST
      - NEW_VPS_SSH_KEY
      - NEW_VPS_USERNAME
      - TEST_LOGIN_USERNAME
      - TEST_LOGIN_PASSWORD
      - MAVEN_USER
      - MAVEN_PASSWORD

  # ------------------------------------------------------------- CI (branch-locked)
  bot-identity:
    branches:
      - main
    reviewers: []
    secrets:
      - GH_APP_ID
      - GH_APP_PRIVATE_KEY

  # Base-image builds are dispatched from whatever branch holds the Dockerfile
  # change (recently main and security/server-image-cves), so no branch policy is
  # workable here. The real control is the github.actor == 'Frooodle' guard in
  # push-docker-base.yml.
  docker-base-publish:
    branches: all
    reviewers: []
    secrets:
      - DOCKER_HUB_USERNAME
      - DOCKER_HUB_ORG_USERNAME
      - DOCKER_HUB_API
      - COSIGN_PRIVATE_KEY
      - COSIGN_PASSWORD

  docker-publish:
    branches:
      - release
      - main
    reviewers: []
    secrets:
      - DOCKER_HUB_USERNAME
      - DOCKER_HUB_ORG_USERNAME
      - DOCKER_HUB_API
      - COSIGN_PRIVATE_KEY
      - COSIGN_PASSWORD
      - MAVEN_USER
      - MAVEN_PASSWORD

  # ----------------------------------------------------------- Release (gated)
  package-publish:
    branches:
      - main
      - release
      - "tag:v*"
    reviewers:
      - Frooodle
      - jbrunton96
    secrets:
      - AUR_SSH_PRIVATE_KEY
      - HOMEBREW_TAP_TOKEN
      - SWAGGERHUB_API_KEY
      - MAVEN_USER
      - MAVEN_PASSWORD

  # hotfix/* is required: every desktop build since 2026-07 was a workflow_dispatch
  # from a hotfix branch, and the existing [main, tag:v*] policy already refuses them.
  release-signing:
    branches:
      - main
      - release
      - "hotfix/*"
      - "tag:v*"
    reviewers:
      - Frooodle
      - jbrunton96
    secrets:
      - APPLE_CERTIFICATE
      - APPLE_CERTIFICATE_PASSWORD
      - APPLE_ID
      - APPLE_ID_PASSWORD
      - APPLE_TEAM_ID
      # WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD are deliberately absent.
      # Their only consumer is the legacy PFX import, gated on `env.SM_API_KEY == ''`
      # - dead while DigiCert KeyLocker is configured, and neither secret exists.
      - SM_API_KEY
      - SM_CLIENT_CERT_FILE_B64
      - SM_CLIENT_CERT_PASSWORD
      - SM_CODE_SIGNING_CERT_SHA1_HASH
      - SM_HOST
      - SM_KEYPAIR_ALIAS
      - RELEASE_GPG_PRIVATE_KEY
      - RELEASE_GPG_PASSPHRASE
      - TAURI_SIGNING_PRIVATE_KEY
      - VITE_SAAS_SERVER_URL
      - VITE_SAAS_BACKEND_API_URL
      - VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY
      - MAVEN_USER
      - MAVEN_PASSWORD
